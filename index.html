/* ===================== CALCULUS I: theory notes ===================== */
Object.assign(NOTES,{
limits:()=>`<p class="lede">A limit describes what a function's output approaches as its input approaches some value, whether or not the function is defined there. Every idea in calculus (continuity, the derivative, the integral) is built on limits.</p>
<h3>The idea</h3>
<p>We write <i class="v">lim<sub>x→a</sub> f(x) = L</i> if f(x) can be made as close to L as we like by taking x close enough to a, but not equal to a. What happens exactly at x = a does not matter.</p>
${fig(figLimitHole(),'f(2) does not exist, yet the outputs approach 4 from both sides.')}
<h3>One-sided limits</h3>
<p>lim<sub>x→a⁻</sub> f(x) uses only x &lt; a (from the left), and lim<sub>x→a⁺</sub> f(x) only x &gt; a. The two-sided limit exists exactly when both one-sided limits exist and are equal. A step in a piecewise function or the expression |x|/x at 0 has different one-sided limits, so no two-sided limit.</p>
${sheet('Limit laws (when the individual limits exist)',[['Sum / difference','lim (f ± g) = lim f ± lim g',''],['Constant multiple','lim (c·f) = c·lim f',''],['Product','lim (f·g) = lim f · lim g',''],['Quotient','lim (f/g) = lim f / lim g','if lim g ≠ 0'],['Power','lim fⁿ = (lim f)ⁿ',''],['Polynomials & rationals','lim p(x) = p(a)','direct substitution, if defined']])}
<h3>A strategy for evaluating limits</h3>
${ul(['<strong>Substitute first.</strong> If you get a number, that is the limit (the function is continuous there).','<strong>0/0 means "do more work".</strong> Factor and cancel, rationalise with a conjugate, or simplify a compound fraction.','<strong>Nonzero/0</strong> means the function blows up: check the sign from each side to decide +∞ or −∞.','<strong>Squeeze theorem:</strong> if g ≤ f ≤ h near a and g, h both → L, then f → L. This proves lim x² sin(1/x) = 0 and lim sin x / x = 1.'])}
${wx('Find lim<sub>x→3</sub> (x² − 9)/(x − 3).',['Substitution gives 0/0, an indeterminate form.','Factor: (x − 3)(x + 3)/(x − 3) = x + 3 for x ≠ 3.','The limit is 3 + 3 = 6. The graph is the line y = x + 3 with a hole at (3, 6).'])}
${wx('Find lim<sub>x→0</sub> (√(x + 4) − 2)/x.',['0/0. Multiply top and bottom by the conjugate √(x + 4) + 2.','Numerator: (x + 4) − 4 = x. The x cancels, leaving 1/(√(x + 4) + 2).','Substitute: 1/(2 + 2) = 1/4.'])}
<h3>Infinite limits and limits at infinity</h3>
<p>If f(x) → ±∞ as x → a, the line x = a is a <strong>vertical asymptote</strong>. If f(x) → L as x → ±∞, the line y = L is a <strong>horizontal asymptote</strong>. For rational functions at infinity, divide every term by the highest power of x in the denominator:</p>
${tbl('Rational functions as x → ±∞',['Degrees','Limit','Example'],[['top &lt; bottom','0','(3x + 1)/(x² + 5) → 0'],['top = bottom','ratio of leading coefficients','(2x² + x)/(5x² − 3) → 2/5'],['top &gt; bottom','±∞ (no horizontal asymptote)','(x³)/(x + 1) → ∞']],[2])}
${dv('The formal (ε–δ) definition',`<p>lim<sub>x→a</sub> f(x) = L means: for every ε &gt; 0 there is a δ &gt; 0 such that 0 &lt; |x − a| &lt; δ implies |f(x) − L| &lt; ε. In words, however tight a tolerance band you demand around L, there is a neighbourhood of a whose outputs (except perhaps at a itself) all fall inside it. For f(x) = 3x + 1 at a = 2, choosing δ = ε/3 works, because |f(x) − 7| = 3|x − 2| &lt; 3δ = ε.</p>`)}
<h3>Common mistakes</h3>
${ul(['Concluding a limit does not exist because substitution gives 0/0. It only means more algebra is needed.','Thinking the limit must equal f(a). It need not, unless f is continuous at a.','Cancelling terms in a sum: (x² + x)/x is not x² + 1, it is x + 1.'])}
${co('EE connection','The steady-state value of a circuit is a limit as t → ∞: v(∞) = lim Vs(1 − e^(−t/τ)) = Vs. Frequency-response asymptotes (gain → 0 at high frequency for a low-pass filter) are limits at infinity.')}`,

continuity:()=>`<p class="lede">A continuous function has no breaks, jumps or holes: you can draw it without lifting your pen. Continuity is what lets us substitute into limits and guarantees that equations have solutions.</p>
<h3>Definition</h3>
<p>f is continuous at x = a when three things hold: f(a) is defined, lim<sub>x→a</sub> f(x) exists, and the two are equal: <i class="v">lim<sub>x→a</sub> f(x) = f(a)</i>. f is continuous on an interval if it is continuous at every point in it (using one-sided limits at closed endpoints).</p>
<h3>Types of discontinuity</h3>
${fig(figDiscont(),'Left: the limit exists but disagrees with f(a). Middle: the one-sided limits differ. Right: the function is unbounded.')}
${tbl('Classifying discontinuities',['Type','What fails','Example'],[['Removable','limit exists but ≠ f(a), or f(a) undefined','(x² − 1)/(x − 1) at x = 1'],['Jump','left and right limits differ','|x|/x at 0; a switch in a circuit'],['Infinite','f → ±∞','1/x at 0'],['Oscillating','no limit at all','sin(1/x) at 0']],[2])}
<p>A removable discontinuity can be "repaired" by redefining a single value. The others cannot.</p>
<h3>Which functions are continuous?</h3>
${ul(['Polynomials, sin x, cos x, eˣ: everywhere.','Rational functions, tan x, ln x, √x: everywhere in their domains.','Sums, products, quotients (where the denominator ≠ 0) and compositions of continuous functions are continuous.','Piecewise functions: check where the pieces meet.'])}
${wx('Find k so that f(x) = kx + 1 for x &lt; 2 and f(x) = x² − 3 for x ≥ 2 is continuous.',['Both pieces are polynomials, so only x = 2 needs checking.','Left limit: 2k + 1. Right value: 4 − 3 = 1.','Set them equal: 2k + 1 = 1, so k = 0.'])}
<h3>The Intermediate Value Theorem</h3>
<p>If f is continuous on [a, b] and N is any value between f(a) and f(b), then there is at least one c in (a, b) with f(c) = N. In particular, if f(a) and f(b) have opposite signs, f has a root between them.</p>
${fig(figIVT(),'A continuous curve cannot get from below the axis to above it without crossing.')}
<p>The IVT tells you a root exists but not where. The <strong>bisection method</strong> uses it to find one: check the sign at the midpoint, keep the half where the sign changes, and repeat. Each step halves the interval, so 10 steps narrow it by a factor of about 1000.</p>
${dv('Why continuity is essential',`<p>f(x) = 1/x has f(−1) = −1 and f(1) = 1, yet it is never zero. The IVT does not apply because f is not continuous on [−1, 1]. Every hypothesis of a theorem matters.</p>`)}
<h3>Extreme Value Theorem</h3>
<p>A function continuous on a <em>closed</em> interval [a, b] attains an absolute maximum and an absolute minimum there. On an open interval, or with a discontinuity, it may not: 1/x on (0, 1] has no maximum.</p>
${co('EE connection','Capacitor voltage and inductor current are continuous in time, which is exactly why you can use v_C(0⁺) = v_C(0⁻) when a switch flips. An ideal switch, by contrast, makes a current jump: a jump discontinuity.')}`,

derivdef:()=>`<p class="lede">The derivative measures instantaneous rate of change: how fast an output changes per unit change of input, at a single instant. Geometrically it is the slope of the tangent line.</p>
<h3>From average to instantaneous</h3>
<p>The average rate of change of f between x and x + h is the slope of the secant line, [f(x + h) − f(x)]/h. Shrinking h towards zero gives the instantaneous rate:</p>
<p style="text-align:center"><i class="v">f′(x) = lim<sub>h→0</sub> [f(x + h) − f(x)] / h</i></p>
${fig(figTangent(),'As h shrinks, the secant swings into the tangent; its slope approaches f′(2).')}
<h3>Notation and meaning</h3>
${tbl('Equivalent notations',['Notation','Read as','Used when'],[['f′(x)','f prime of x','functions'],['dy/dx','dee y by dee x','relations between variables'],['ẋ','x dot','time derivatives in physics'],['d/dx [ … ]','the derivative of …','applying an operator']],[0])}
<p>Units: the derivative has units of output per input. If s is in metres and t in seconds, ds/dt is in m/s. If q is in coulombs, dq/dt is in amperes.</p>
${wx('Find f′(x) for f(x) = x² from the definition.',['f(x + h) − f(x) = (x + h)² − x² = 2xh + h².','Divide by h: 2x + h.','Let h → 0: f′(x) = 2x.'])}
${wx('Find f′(x) for f(x) = 1/x from the definition.',['f(x + h) − f(x) = 1/(x + h) − 1/x = −h / (x(x + h)).','Divide by h: −1 / (x(x + h)).','Let h → 0: f′(x) = −1/x².'])}
<h3>Tangent lines</h3>
<p>The tangent to y = f(x) at x = a passes through (a, f(a)) with slope f′(a): <i class="v">y = f(a) + f′(a)(x − a)</i>. The normal line is perpendicular to it, with slope −1/f′(a).</p>
<h3>Differentiability</h3>
<p>f is differentiable at a if f′(a) exists. Differentiable implies continuous, but not the reverse. A function fails to be differentiable at:</p>
${ul(['a <strong>corner</strong>, such as |x| at 0, where the left and right slopes differ;','a <strong>cusp</strong>, such as x<sup>2/3</sup> at 0;','a <strong>vertical tangent</strong>, such as ∛x at 0;','any <strong>discontinuity</strong>.'])}
<h3>Higher derivatives</h3>
<p>The second derivative f″(x) is the derivative of f′. For position s(t): velocity v = s′, acceleration a = s″, and jerk = s‴. The second derivative also describes concavity (see Curve Sketching).</p>
${co('EE connection','Current is the derivative of charge (i = dq/dt), capacitor current is C·dv/dt and inductor voltage is L·di/dt. Every time you see "rate", there is a derivative.')}`,

deriv:()=>`<p class="lede">Computing derivatives from the limit definition every time would be slow. A handful of rules, all proved from the definition, let you differentiate almost any formula quickly.</p>
${sheet('Differentiation rules',[['Constant','(c)′ = 0',''],['Power rule','(xⁿ)′ = n·xⁿ⁻¹','any real n: x⁻², √x, x^(3/2)…'],['Constant multiple','(c·f)′ = c·f′',''],['Sum / difference','(f ± g)′ = f′ ± g′','term by term'],['Product rule','(fg)′ = f′g + fg′','"first times derivative of second, plus…"'],['Quotient rule','(f/g)′ = (f′g − fg′) / g²','"low d-high minus high d-low, over low squared"'],['Chain rule','(f(g(x)))′ = f′(g(x))·g′(x)','differentiate outside, keep inside, multiply by inside′']])}
<h3>Power rule with any exponent</h3>
<p>Rewrite roots and reciprocals as powers before differentiating: √x = x<sup>1/2</sup> → ½x<sup>−1/2</sup>; 5/x³ = 5x<sup>−3</sup> → −15x<sup>−4</sup>.</p>
${dv('Proof of the product rule',`<p>[f(x + h)g(x + h) − f(x)g(x)]/h. Add and subtract f(x + h)g(x): = f(x + h)·[g(x + h) − g(x)]/h + g(x)·[f(x + h) − f(x)]/h. As h → 0 this tends to f(x)g′(x) + g(x)f′(x), using continuity of f.</p>`)}
${dv('Why the chain rule multiplies rates',`<p>If y = f(u) and u = g(x), a small change Δx causes Δu ≈ g′(x)Δx, which causes Δy ≈ f′(u)Δu ≈ f′(u)g′(x)Δx. So dy/dx = (dy/du)(du/dx). If a gear turns 3 times as fast as a second gear, which turns 2 times as fast as a third, the first turns 6 times as fast as the third.</p>`)}
${wx('Differentiate f(x) = (3x² + 1)⁵.',['Outer function u⁵, inner u = 3x² + 1.','Outer derivative 5u⁴, inner derivative 6x.','f′(x) = 5(3x² + 1)⁴ · 6x = 30x(3x² + 1)⁴.'])}
${wx('Differentiate f(x) = x²/(x + 1).',['Quotient rule with u = x², v = x + 1: u′ = 2x, v′ = 1.','f′ = (2x(x + 1) − x²·1)/(x + 1)² = (x² + 2x)/(x + 1)².'])}
<h3>Choosing a rule</h3>
${ul(['Look at the <em>last</em> operation you would do to evaluate the expression: that decides the rule (sum, product, quotient or composition).','A quotient with a constant numerator or denominator is easier as a power: 1/(x² + 1) = (x² + 1)⁻¹.','Simplify first when you can: (x² + x)/x = x + 1 needs no quotient rule.'])}
<h3>Common mistakes</h3>
${ul(['(fg)′ ≠ f′g′ and (f/g)′ ≠ f′/g′.','Forgetting the inner derivative in the chain rule.','Sign errors in the quotient rule: the order is f′g − fg′.','Applying the power rule to eˣ or 2ˣ, where the variable is in the exponent.'])}`,

transc:()=>`<p class="lede">Trigonometric, exponential and logarithmic functions describe oscillations, growth, decay and signal levels. Their derivatives are surprisingly simple and appear throughout engineering.</p>
${sheet('Derivatives to know by heart',[['Sine / cosine','(sin x)′ = cos x,  (cos x)′ = −sin x','x in radians'],['Tangent','(tan x)′ = sec²x',''],['Other trig','(sec x)′ = sec x tan x,  (csc x)′ = −csc x cot x,  (cot x)′ = −csc²x',''],['Natural exponential','(eˣ)′ = eˣ','its own derivative'],['General exponential','(aˣ)′ = aˣ ln a',''],['Natural log','(ln x)′ = 1/x','x &gt; 0; (ln|x|)′ = 1/x'],['General log','(log_a x)′ = 1/(x ln a)',''],['Inverse sine / tangent','(arcsin x)′ = 1/√(1 − x²),  (arctan x)′ = 1/(1 + x²)','']])}
${fig(figTrigDeriv(),'Where sin x has a peak or trough, its slope (cos x) is zero.')}
${dv('Why (sin x)′ = cos x',`<p>[sin(x + h) − sin x]/h = sin x·(cos h − 1)/h + cos x·(sin h)/h. As h → 0, (sin h)/h → 1 and (cos h − 1)/h → 0 (both from the squeeze theorem), leaving cos x. These limits only hold with h in radians, which is why calculus always uses radians.</p>`)}
${dv('Why e is special',`<p>For aˣ, the derivative is aˣ·lim (aʰ − 1)/h. That limit equals 1 for exactly one base, a = e ≈ 2.71828. With that base, the derivative of eˣ is eˣ itself, so eˣ is the solution to "rate of change equals current amount", the law behind RC discharge, radioactive decay and compound interest.</p>`)}
<h3>With the chain rule</h3>
${tbl('Common chain-rule patterns',['Function','Derivative'],[['sin(kx)','k cos(kx)'],['e^(kx)','k e^(kx)'],['e^(g(x))','g′(x) e^(g(x))'],['ln(g(x))','g′(x) / g(x)'],['sinⁿx','n sinⁿ⁻¹x · cos x']])}
${wx('Differentiate v(t) = 10e^(−t/τ) sin(ωt), a damped oscillation.',['Product rule: u = 10e^(−t/τ), w = sin ωt.','u′ = −(10/τ)e^(−t/τ), w′ = ω cos ωt.','v′ = 10e^(−t/τ)[ω cos ωt − (1/τ) sin ωt].'])}
${wx('Differentiate f(x) = ln(x² + 1).',['Chain rule with g = x² + 1, g′ = 2x.','f′(x) = 2x/(x² + 1).'])}
<h3>Common mistakes</h3>
${ul(['Using degrees: d/dx sin(x°) = (π/180) cos(x°).','Writing (eˣ)′ = x·eˣ⁻¹ (the power rule does not apply).','(ln x)′ = 1/x, but (ln 5)′ = 0: ln 5 is a constant.','Forgetting the chain rule inside: (sin 3x)′ = 3 cos 3x.'])}
${co('EE connection','For v = Vp sin ωt, the capacitor current C·dv/dt = ωCVp cos ωt leads the voltage by 90° and grows with frequency. That is the origin of capacitive reactance 1/(ωC). Decibels use logarithms because ears and systems respond to ratios.')}`,

implicit:()=>`<p class="lede">Some curves are defined by an equation linking x and y rather than by y = f(x): circles, ellipses, and many physical laws. Implicit differentiation finds dy/dx without solving for y first.</p>
<h3>The method</h3>
${ul(['Differentiate both sides of the equation with respect to x.','Whenever you differentiate an expression in y, multiply by dy/dx (chain rule): d/dx(y²) = 2y·y′, d/dx(sin y) = cos y·y′.','Use the product rule on mixed terms: d/dx(xy) = y + x·y′.','Collect all y′ terms on one side and solve for y′.'])}
${fig(figImplicit(),'The tangent at (3, 4) is perpendicular to the radius, slope −3/4.')}
${wx('Find dy/dx for x² + y² = 25 at (3, 4).',['Differentiate: 2x + 2y·y′ = 0.','y′ = −x/y.','At (3, 4): y′ = −3/4. Solving for y = √(25 − x²) first gives the same answer with more work.'])}
${wx('Find dy/dx for x³ + y³ = 6xy (the folium of Descartes).',['3x² + 3y²·y′ = 6y + 6x·y′.','Collect: y′(3y² − 6x) = 6y − 3x².','y′ = (2y − x²)/(y² − 2x).'])}
<h3>Second derivatives implicitly</h3>
<p>Differentiate the expression for y′ again, then substitute y′ back in. For the circle, y′ = −x/y gives y″ = −(y − x·y′)/y² = −(x² + y²)/y³ = −25/y³.</p>
<h3>Logarithmic differentiation</h3>
<p>For products, quotients and powers of many factors, or a variable in both base and exponent, take ln of both sides first. Logs turn products into sums and powers into multiples, which are easier to differentiate.</p>
${wx('Differentiate y = xˣ.',['ln y = x ln x.','Differentiate: y′/y = ln x + 1.','y′ = xˣ(ln x + 1).'])}
${wx('Differentiate y = x³√(x + 1)/(2x − 1)⁴.',['ln y = 3 ln x + ½ ln(x + 1) − 4 ln(2x − 1).','y′/y = 3/x + 1/(2(x + 1)) − 8/(2x − 1).','Multiply through by y.'])}
<h3>Inverse function derivatives</h3>
<p>Implicit differentiation also explains the inverse-function formulas. If y = arcsin x then sin y = x; differentiating gives cos y·y′ = 1, so y′ = 1/cos y = 1/√(1 − x²). In general, (f⁻¹)′(x) = 1/f′(f⁻¹(x)).</p>
${co('EE connection','Device laws are often implicit: a diode in series with a resistor obeys I = I_s(e^(V/V_T) − 1) with V = V_s − IR. Differentiating implicitly gives the small-signal resistance, and sensitivities such as dI/dV_s, without ever solving the equation in closed form.')}`,

related:()=>`<p class="lede">When several quantities are linked by an equation and they all change with time, their rates of change are linked too. Related-rates problems find one rate from others.</p>
<h3>Method</h3>
${ul(['Draw a picture and label every quantity that changes with a variable (not a number).','Write an equation relating the variables (geometry, Pythagoras, similar triangles, a physical law).','Differentiate both sides with respect to time t, using the chain rule on every variable.','Only now substitute the values at the instant of interest and solve for the unknown rate.'])}
${fig(figLadder(),'x and y change, L stays fixed. Differentiating x² + y² = L² links dx/dt and dy/dt.')}
${wx('A 10 m ladder slides; its foot moves away at 1 m/s. How fast does the top fall when the foot is 6 m out?',['x² + y² = 100, so 2x·ẋ + 2y·ẏ = 0.','At x = 6: y = 8.','ẏ = −x·ẋ/y = −6 × 1/8 = −0.75 m/s. The top falls faster and faster as the ladder flattens.'])}
${wx('A spherical balloon is inflated at 100 cm³/s. How fast is the radius growing when r = 5 cm?',['V = (4/3)πr³, so dV/dt = 4πr²·dr/dt.','100 = 4π(25)·dr/dt.','dr/dt = 1/π ≈ 0.318 cm/s.'])}
${tbl('Useful relations',['Situation','Equation'],[['Right triangle','x² + y² = z²'],['Circle area / circumference','A = πr², C = 2πr'],['Sphere','V = (4/3)πr³, S = 4πr²'],['Cone','V = (1/3)πr²h, with r/h fixed by similar triangles'],['Angle of elevation','tan θ = y/x'],['Ohm\'s law / power','V = IR, P = V²/R']])}
<h3>Common mistakes</h3>
${ul(['Substituting numbers before differentiating, which turns changing quantities into constants.','Missing a sign: a decreasing quantity has a negative rate.','Forgetting the chain rule: d/dt(r²) = 2r·dr/dt, not 2r.'])}
${co('EE connection','i = C·dv/dt and v = L·di/dt are related-rates statements. Thermal drift calculations (dR/dt = R₀α·dT/dt) and power ramps (dP/dt = 2V/R·dV/dt) work the same way.')}`,

linapprox:()=>`<p class="lede">Close to a point, a smooth curve looks like its tangent line. Replacing a function by that line gives quick estimates and is the basis of small-signal analysis in electronics.</p>
<h3>Linearisation</h3>
<p>The linearisation of f at x = a is <i class="v">L(x) = f(a) + f′(a)(x − a)</i>, so f(x) ≈ L(x) for x near a. The error shrinks like (x − a)², and its sign depends on concavity: a concave-down function lies below its tangents, so the estimate is too high.</p>
${fig(figLinApprox(),'Near x = 4 the tangent line is almost indistinguishable from √x.')}
${tbl('Standard approximations near 0',['Function','≈'],[['sin x','x'],['cos x','1 − x²/2'],['tan x','x'],['eˣ','1 + x'],['ln(1 + x)','x'],['(1 + x)ⁿ','1 + nx'],['√(1 + x)','1 + x/2']])}
<h3>Differentials and error propagation</h3>
<p>The differential dy = f′(x)·dx estimates the change Δy caused by a small change dx. For a power law y = cxⁿ, the relative error obeys <i class="v">dy/y = n·dx/x</i>: a 2% error in a radius gives about a 4% error in an area and a 6% error in a volume.</p>
${wx('Estimate √4.1.',['Use f(x) = √x at a = 4: f(4) = 2, f′(4) = 1/4.','L(4.1) = 2 + 0.25 × 0.1 = 2.025.','The true value is 2.02485…, so the error is about 0.00015.'])}
<h3>Newton's method</h3>
<p>To solve f(x) = 0, start with a guess x₀, follow the tangent line to where it crosses the axis, and repeat:</p>
<p style="text-align:center"><i class="v">xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ)</i></p>
${fig(figNewton(),'Each tangent lands much closer to the root. The number of correct digits roughly doubles every step.')}
${wx('Find √2 with Newton\'s method on f(x) = x² − 2, starting at x₀ = 1.5.',['x₁ = 1.5 − (0.25)/(3) = 1.41667.','x₂ = 1.41667 − (0.00694)/(2.83333) = 1.414216.','√2 = 1.4142136…, so 6 digits are correct after two steps.'])}
${dv('When Newton\'s method fails',`<p>If f′(xₙ) = 0 the tangent is horizontal and never meets the axis. Starting too far from the root, or near a local extremum, the iterates may jump away or cycle. Choose a starting point near the root (from a graph or a bisection step) and check that the values settle down.</p>`)}
${co('EE connection','Small-signal models linearise non-linear parts around an operating point: a diode or transistor is replaced by its tangent-line slope, an incremental resistance r = dV/dI. Circuit simulators such as SPICE solve the non-linear circuit equations with Newton\'s method at every time step.')}`,

curves:()=>`<p class="lede">The first and second derivatives tell you where a graph rises and falls, where it peaks, and which way it bends. Together they let you sketch any function accurately without plotting hundreds of points.</p>
<h3>What the first derivative tells you</h3>
${ul(['f′ &gt; 0 on an interval → f is increasing there; f′ &lt; 0 → decreasing.','<strong>Critical points</strong> are where f′ = 0 or f′ does not exist. Local maxima and minima can only occur there.','<strong>First derivative test:</strong> if f′ changes from + to − at c, f has a local max; from − to +, a local min; no sign change, neither.'])}
<h3>What the second derivative tells you</h3>
${ul(['f″ &gt; 0 → concave up (a cup, slope increasing); f″ &lt; 0 → concave down (a cap).','An <strong>inflection point</strong> is where the concavity changes.','<strong>Second derivative test:</strong> if f′(c) = 0 and f″(c) &lt; 0, c is a local max; if f″(c) &gt; 0, a local min; if f″(c) = 0, the test is inconclusive.'])}
${fig(figSketch(),'f(x) = x³ − 3x: max at x = −1, min at x = 1, inflection at x = 0.')}
${tbl('Sign chart for f(x) = x³ − 3x',['x','(−∞, −1)','−1','(−1, 0)','0','(0, 1)','1','(1, ∞)'],[['f′ = 3(x² − 1)','+','0','−','−','−','0','+'],['f″ = 6x','−','−','−','0','+','+','+'],['shape','rising, ∩','max','falling, ∩','inflection','falling, ∪','min','rising, ∪']],[1,2,3,4,5,6,7])}
<h3>A checklist for sketching</h3>
${ul(['Domain, intercepts and symmetry (even, odd, periodic).','Asymptotes: vertical from zero denominators, horizontal from limits at ±∞.','f′: critical points, intervals of increase and decrease, local extrema.','f″: concavity and inflection points.','Plot the key points and join them with the right shapes.'])}
<h3>Absolute extrema on a closed interval</h3>
<p>For f continuous on [a, b]: evaluate f at every critical point inside the interval and at both endpoints. The largest value is the absolute maximum and the smallest is the absolute minimum.</p>
<h3>Rolle's Theorem and the Mean Value Theorem</h3>
<p><strong>Rolle:</strong> if f is continuous on [a, b], differentiable on (a, b), and f(a) = f(b), then f′(c) = 0 for some c in between. <strong>Mean Value Theorem:</strong> under the same smoothness conditions, some c satisfies <i class="v">f′(c) = [f(b) − f(a)] / (b − a)</i>: at some instant, the instantaneous rate equals the average rate.</p>
${fig(figMVT(),'Somewhere between a and b, the tangent is parallel to the secant.')}
${dv('Consequences of the MVT',`<p>If f′ = 0 everywhere on an interval, f is constant there. If f′ = g′, then f and g differ by a constant, which is why antiderivatives are unique up to "+ C". And if a car averages 100 km/h over a trip, the MVT guarantees the speedometer read exactly 100 at some moment.</p>`)}
${co('EE connection','Finding where a gain curve peaks (resonance), where a transfer characteristic is steepest (an amplifier\'s best operating point) or where efficiency is highest are all "set the derivative to zero" problems.')}`,

optim:()=>`<p class="lede">Optimization uses derivatives to find the best value of something: maximum area, minimum material, maximum power, lowest cost. It is calculus at its most practical.</p>
${fig(figOpt(),'At a smooth interior maximum the tangent is horizontal.')}
<h3>A reliable method</h3>
${ul(['<strong>Understand and sketch.</strong> What is being maximised or minimised? What can vary?','<strong>Name variables</strong> and write the objective, e.g. A = xy.','<strong>Use the constraint</strong> (fixed perimeter, fixed volume, a circuit law) to write the objective in one variable.','<strong>State the domain</strong>: physical limits such as x &gt; 0 or x &lt; s/2.','<strong>Differentiate, set to zero, solve.</strong>','<strong>Check it is the optimum</strong> (second-derivative test, sign of f′, or compare with endpoint values), then answer the question asked, with units.'])}
${wx('A box with a square base and open top must hold 32 000 cm³. Minimise the material.',['Base x by x, height h: x²h = 32 000, so h = 32 000/x².','Surface area S = x² + 4xh = x² + 128 000/x.','S′ = 2x − 128 000/x² = 0 gives x³ = 64 000, so x = 40 cm and h = 20 cm.','S″ = 2 + 256 000/x³ &gt; 0, so it is a minimum: S = 4800 cm².'])}
${wx('Maximum power transfer: a source V with internal resistance r drives a load R. Which R maximises the load power?',['P(R) = I²R = V²R/(R + r)².','P′(R) = V²[(R + r)² − 2R(R + r)]/(R + r)⁴ = V²(r − R)/(R + r)³.','P′ = 0 at R = r, positive before and negative after, so it is a maximum: P_max = V²/(4r).'])}
${tbl('Classic results worth remembering',['Problem','Optimum'],[['Rectangle of fixed perimeter, max area','a square'],['Rectangle along a river (3 sides fenced), length L','sides L/4, L/2, L/4'],['Cylinder of fixed volume, min surface area','height = diameter'],['Open box from a square sheet of side s','cut squares of side s/6'],['Two numbers with fixed product P, min sum','both √P'],['Load power from a source with resistance r','R = r']],[1])}
<h3>Common mistakes</h3>
${ul(['Optimising before eliminating the second variable.','Ignoring endpoints: the best answer can be at the boundary.','Answering with x when the question asked for the maximum area (or vice versa).'])}
${co('EE connection','Impedance matching, choosing a heat sink for minimum cost, sizing a wire to balance loss against copper cost, and finding the maximum power point of a solar panel (P = VI peaks where dP/dV = 0) are all optimization problems.')}`,

lhopital:()=>`<p class="lede">L'Hôpital's rule turns hard limits of indeterminate forms into easier limits of derivatives. It is the fastest route through 0/0 and ∞/∞, and with a little algebra it handles the other indeterminate forms too.</p>
<h3>The rule</h3>
<p>If lim f(x) and lim g(x) are both 0, or both ±∞, then <i class="v">lim f(x)/g(x) = lim f′(x)/g′(x)</i>, provided the right-hand limit exists. Differentiate the top and bottom <em>separately</em>; this is not the quotient rule.</p>
${fig(figSinc(),'sin x / x is 0/0 at x = 0, but approaches 1.')}
${wx('lim<sub>x→0</sub> sin(3x)/(5x)',['0/0, so differentiate top and bottom: 3 cos(3x)/5.','At x = 0: 3/5.'])}
${wx('lim<sub>x→0</sub> (1 − cos x)/x²',['0/0 → sin x/(2x), still 0/0.','Apply again: cos x/2 → 1/2.'])}
<h3>Other indeterminate forms</h3>
${tbl('Converting to 0/0 or ∞/∞',['Form','Trick','Example'],[['0 · ∞','write f·g as f/(1/g)','x ln x as x → 0⁺: (ln x)/(1/x) → 0'],['∞ − ∞','combine into one fraction','1/x − 1/sin x → 0'],['1^∞, 0⁰, ∞⁰','take ln, find that limit, then exponentiate','(1 + 1/x)ˣ → e']],[2])}
${dv('Why the rule works (0/0 case)',`<p>If f(a) = g(a) = 0, then f(x)/g(x) = [f(x) − f(a)]/[g(x) − g(a)] = ([f(x) − f(a)]/(x − a)) / ([g(x) − g(a)]/(x − a)). As x → a these difference quotients become f′(a) and g′(a). Near a, both functions look like their tangent lines, so their ratio looks like the ratio of slopes.</p>`)}
<h3>Growth rates</h3>
<p>Repeated use of L'Hôpital shows that as x → ∞: <i class="v">ln x ≪ xᵖ ≪ eˣ</i> for any p &gt; 0. Logarithms grow slower than any power, and exponentials faster than any power. So x¹⁰⁰/eˣ → 0 and (ln x)/√x → 0.</p>
<h3>Common mistakes</h3>
${ul(['Using the rule when the form is not indeterminate: lim (x + 1)/x as x → 0 is not 0/0.','Applying the quotient rule instead of differentiating top and bottom separately.','Forgetting to re-check the form before applying the rule a second time.'])}
${co('EE connection','Sinc functions sin(x)/x describe the spectrum of a rectangular pulse and the response of digital filters. Their value at 0 comes from exactly this limit. Exponential decay beating polynomial growth is why every stable circuit\'s transient eventually dies away.')}`,

antideriv:()=>`<p class="lede">Antidifferentiation runs the derivative backwards: given a rate, recover the quantity. It is the bridge from derivatives to integrals.</p>
<h3>Definition</h3>
<p>F is an antiderivative of f if F′(x) = f(x). Antiderivatives are not unique: adding any constant C gives another, because constants differentiate to zero. The MVT shows these are the only ones. The general antiderivative is written <i class="v">∫f(x) dx = F(x) + C</i>, the indefinite integral.</p>
${fig(figFamily(),'Every curve has the same slope at each x. An initial condition picks one.')}
${sheet('Basic antiderivatives',[['Power','∫xⁿ dx = xⁿ⁺¹/(n + 1) + C','n ≠ −1'],['Reciprocal','∫(1/x) dx = ln|x| + C','the n = −1 case'],['Exponential','∫e^(kx) dx = e^(kx)/k + C',''],['Sine / cosine','∫sin(kx) dx = −cos(kx)/k + C,  ∫cos(kx) dx = sin(kx)/k + C',''],['Sec²','∫sec²x dx = tan x + C',''],['Inverse tan','∫dx/(1 + x²) = arctan x + C',''],['Linearity','∫(af + bg) dx = a∫f dx + b∫g dx','term by term']])}
<p>Always check an antiderivative by differentiating it: you should get back the original integrand.</p>
<h3>Initial value problems</h3>
<p>Given F′ = f and one known value F(x₀) = y₀, find the general antiderivative and use the known value to fix C. Physical problems give these naturally: a starting position, an initial charge or an initial velocity.</p>
${wx('A particle has a(t) = 6t m/s², v(0) = 2 m/s and x(0) = 5 m. Find x(t).',['v(t) = ∫6t dt = 3t² + C₁; v(0) = 2 gives C₁ = 2.','x(t) = ∫(3t² + 2) dt = t³ + 2t + C₂; x(0) = 5 gives C₂ = 5.','x(t) = t³ + 2t + 5.'])}
${wx('A capacitor (C = 100 µF, initially uncharged) receives i(t) = 0.01 A for 5 ms. Find its final voltage.',['v(t) = (1/C)∫i dt = (0.01/100×10⁻⁶)·t = 100t volts.','At t = 5 ms: v = 0.5 V.'])}
<h3>Common mistakes</h3>
${ul(['Forgetting + C, which loses every solution but one.','∫xⁿ dx with n = −1: the answer is ln|x|, not x⁰/0.','∫e^(3x) dx = e^(3x)/3, not 3e^(3x).','∫f·g dx is not (∫f)(∫g).'])}
${co('EE connection','A capacitor integrates current (v = (1/C)∫i dt) and an inductor integrates voltage (i = (1/L)∫v dt). An op-amp integrator circuit computes an antiderivative in real time, and the initial condition is the capacitor\'s starting voltage.')}`,

integ:()=>`<p class="lede">The definite integral adds up infinitely many infinitely thin pieces. It measures accumulated quantities: area under a curve, distance from velocity, charge from current, energy from power.</p>
<h3>Riemann sums</h3>
<p>Split [a, b] into n strips of width Δx = (b − a)/n. In each strip pick a sample point xᵢ* and form rectangles of height f(xᵢ*): the Riemann sum is <i class="v">Σ f(xᵢ*)Δx</i>. Using left endpoints, right endpoints or midpoints gives the left, right and midpoint sums.</p>
${fig(figRiemann(),'Midpoint rectangles. More, thinner rectangles give a better estimate.')}
<h3>The definite integral</h3>
<p>As n → ∞ the Riemann sums of a continuous function approach a single number, the definite integral: <i class="v">∫ₐᵇ f(x) dx = lim<sub>n→∞</sub> Σ f(xᵢ*)Δx</i>. It is the <em>signed</em> area: regions below the axis count as negative.</p>
${sheet('Properties of the definite integral',[['Linearity','∫(af + bg) = a∫f + b∫g',''],['Additivity','∫ₐᵇ f + ∫ᵦᶜ f = ∫ₐᶜ f','b between or not'],['Reversing limits','∫ᵦₐ f = −∫ₐᵇ f',''],['Zero width','∫ₐₐ f = 0',''],['Comparison','f ≤ g ⇒ ∫f ≤ ∫g',''],['Odd function','∫₋ₐᵃ f = 0','x, x³, sin x'],['Even function','∫₋ₐᵃ f = 2∫₀ᵃ f','x², cos x']])}
<h3>Numerical integration</h3>
${tbl('Approximation rules (n strips, Δx = (b − a)/n)',['Rule','Formula','Error shrinks like'],[['Left / right','Δx·Σ f(endpoints)','1/n'],['Midpoint','Δx·Σ f(midpoints)','1/n²'],['Trapezoidal','(Δx/2)[f₀ + 2f₁ + … + 2fₙ₋₁ + fₙ]','1/n²'],['Simpson\'s (n even)','(Δx/3)[f₀ + 4f₁ + 2f₂ + 4f₃ + … + fₙ]','1/n⁴']],[1])}
${wx('Estimate ∫₀² x² dx with a right Riemann sum, n = 4.',['Δx = 0.5; right endpoints 0.5, 1, 1.5, 2.','Sum = 0.5 × (0.25 + 1 + 2.25 + 4) = 3.75.','The exact value is 8/3 ≈ 2.667; right sums overestimate an increasing function.'])}
${dv('Evaluating a limit of sums exactly',`<p>For ∫₀¹ x² dx with right endpoints, xᵢ = i/n and the sum is (1/n³)Σi² = (1/n³)·n(n + 1)(2n + 1)/6. As n → ∞ this tends to 2/6 = 1/3. The Fundamental Theorem of Calculus gives the same answer in one line, which is why it matters so much.</p>`)}
${co('EE connection','Digital systems integrate numerically: a microcontroller estimating battery charge sums I·Δt every sample (coulomb counting), which is exactly a Riemann sum. Oscilloscopes compute RMS and average values the same way.')}`,

ftc:()=>`<p class="lede">The Fundamental Theorem of Calculus connects the two halves of calculus: integration and differentiation are inverse processes. It turns the hard problem of limits of sums into the easier problem of finding an antiderivative.</p>
<h3>Part 1: differentiating an accumulation</h3>
<p>If f is continuous and <i class="v">A(x) = ∫ₐˣ f(t) dt</i>, then A′(x) = f(x). The rate at which area accumulates equals the height of the curve.</p>
${fig(figFTC(),'Pushing x a little further adds a thin strip of area about f(x)·h.')}
${dv('Why Part 1 is true',`<p>A(x + h) − A(x) = ∫ₓ^(x+h) f(t) dt, the area of a thin strip. For small h that strip is nearly a rectangle of height f(x) and width h. Dividing by h and letting h → 0 gives A′(x) = f(x). With a variable upper limit u(x), the chain rule adds a factor: d/dx ∫ₐ^(u(x)) f(t) dt = f(u(x))·u′(x).</p>`)}
<h3>Part 2: evaluating definite integrals</h3>
<p>If F is any antiderivative of f, then <i class="v">∫ₐᵇ f(x) dx = F(b) − F(a)</i>, written [F(x)]ₐᵇ. The constant C cancels, so any antiderivative works.</p>
${wx('Evaluate ∫₁³ (2x + 1) dx.',['Antiderivative F(x) = x² + x.','F(3) − F(1) = 12 − 2 = 10.'])}
${wx('Evaluate ∫₀^π sin x dx.',['F(x) = −cos x.','−cos π − (−cos 0) = 1 + 1 = 2: the area under one arch of the sine curve.'])}
${wx('Find d/dx ∫₀^(x²) cos t dt.',['Chain rule version of Part 1: cos(x²)·2x.'])}
<h3>The net change theorem</h3>
<p>Integrating a rate of change gives the total change: <i class="v">∫ₐᵇ F′(t) dt = F(b) − F(a)</i>. Velocity integrates to displacement (not distance, which needs ∫|v| dt), current to charge, power to energy, and flow rate to volume.</p>
${tbl('Rates and their integrals',['Rate','Integral gives'],[['velocity v(t)','displacement'],['|v(t)|','distance travelled'],['current i(t)','charge transferred'],['power p(t)','energy'],['flow rate','volume']])}
<h3>Common mistakes</h3>
${ul(['Mixing the order: F(b) − F(a), not F(a) − F(b).','Forgetting the chain-rule factor when the upper limit is a function of x.','Using FTC across a discontinuity: ∫₋₁¹ dx/x² is not −2; the integrand blows up at 0, so the integral diverges.'])}
${co('EE connection','Energy delivered by a signal is ∫v·i dt; charge on a capacitor is ∫i dt; a battery\'s mAh rating is literally an integral of current over time. FTC turns each into "evaluate an antiderivative at the endpoints".')}`,

subst:()=>`<p class="lede">Substitution is the chain rule run backwards. It is the first technique to try whenever an integrand contains a function together with (a multiple of) that function's derivative.</p>
<h3>The rule</h3>
<p>If u = g(x), then du = g′(x) dx and <i class="v">∫f(g(x))·g′(x) dx = ∫f(u) du</i>. Spot an "inside" function whose derivative also appears as a factor.</p>
${ul(['Choose u: usually the inside of a power, root, exponential, log or trig function.','Compute du = g′(x) dx and rearrange to replace every x in the integral.','Integrate in u.','Indefinite integral: substitute back to x. Definite integral: change the limits to u-values instead.'])}
${wx('∫2x(x² + 1)⁵ dx',['u = x² + 1, du = 2x dx.','∫u⁵ du = u⁶/6 + C.','= (x² + 1)⁶/6 + C. Check by differentiating.'])}
${wx('∫₀^(π/2) sin³x cos x dx',['u = sin x, du = cos x dx; limits 0 → 0 and π/2 → 1.','∫₀¹ u³ du = 1/4.'])}
${wx('∫ x/(x² + 4) dx',['u = x² + 4, du = 2x dx, so x dx = du/2.','(1/2)∫du/u = (1/2) ln|u| + C = (1/2) ln(x² + 4) + C.'])}
${tbl('Patterns to recognise',['Integrand','Substitution','Result'],[['f(ax + b)','u = ax + b','(1/a)F(ax + b)'],['g′(x)/g(x)','u = g(x)','ln|g(x)|'],['g′(x)·e^(g(x))','u = g(x)','e^(g(x))'],['sinⁿx·cos x','u = sin x','sinⁿ⁺¹x/(n + 1)'],['(ln x)ⁿ/x','u = ln x','(ln x)ⁿ⁺¹/(n + 1)']],[1,2])}
${dv('Looking ahead: other techniques',`<p>Integration by parts (∫u dv = uv − ∫v du) reverses the product rule and handles t·e^(−t), x sin x and ln x. Partial fractions split rational functions, and trigonometric substitution handles √(a² − x²). These are usually covered in Calculus II and in Laplace-transform work for circuits.</p>`)}
<h3>Common mistakes</h3>
${ul(['Leaving some x in the integral after substituting.','Forgetting to change the limits (or to substitute back) in a definite integral.','Missing the constant factor when du is only a multiple of what appears, e.g. x dx = du/2.'])}
${co('EE connection','Integrals such as ∫e^(−t/τ) dt and ∫sin(ωt + φ) dt appear in every transient and AC power calculation. Each is a one-line substitution (u = −t/τ, u = ωt + φ).')}`,

intapps:()=>`<p class="lede">Integration is a general way to add up a quantity that varies continuously. The same "slice, approximate, add, take the limit" idea gives areas, volumes, averages, work, charge and RMS values.</p>
<h3>Area between curves</h3>
<p>If f(x) ≥ g(x) on [a, b], the area between them is <i class="v">A = ∫ₐᵇ [f(x) − g(x)] dx</i>, top minus bottom. Find the intersection points to get the limits, and split the interval wherever the curves cross.</p>
${fig(figAreaBetween(),'Thin vertical strips of height (top − bottom) add up to the area.')}
<h3>Volumes of revolution</h3>
<p>Rotating y = f(x) about the x-axis, each slice is a disk of radius f(x): <i class="v">V = ∫ₐᵇ π[f(x)]² dx</i>. If there is a hole (inner radius g(x)), use washers: V = ∫π(f² − g²) dx. Rotating about the y-axis, cylindrical shells give V = ∫2πx·f(x) dx.</p>
${fig(figDisk(),'Each thin slice is a disk with volume π·f(x)²·dx.')}
<h3>Average value</h3>
<p><i class="v">f_avg = (1/(b − a)) ∫ₐᵇ f(x) dx</i>. By the Mean Value Theorem for integrals, a continuous f actually equals its average somewhere in the interval.</p>
<h3>RMS value</h3>
<p>The root-mean-square of a periodic signal is <i class="v">V_rms = √((1/T)∫₀ᵀ v² dt)</i>: square, average, square-root. It is the DC voltage that would deliver the same average power to a resistor.</p>
${tbl('Average and RMS of common waveforms (peak Vp)',['Waveform','Average (full cycle)','RMS'],[['Sine','0','Vp/√2 ≈ 0.707Vp'],['Full-wave rectified sine','2Vp/π ≈ 0.637Vp','Vp/√2'],['Half-wave rectified sine','Vp/π','Vp/2'],['Square (±Vp)','0','Vp'],['Triangle / sawtooth','0','Vp/√3']],[1,2])}
<h3>Work</h3>
<p>For a variable force, W = ∫F(x) dx. A spring needs W = ∫kx dx = ½kx². Pumping liquid out of a tank, lifting a hanging cable, and moving a charge against a varying field are all of this form.</p>
${wx('Find the RMS value of v(t) = Vp sin ωt.',['v² = Vp² sin²ωt = (Vp²/2)(1 − cos 2ωt).','Averaged over a period, the cos 2ωt term averages to 0, leaving Vp²/2.','V_rms = Vp/√2. That is why 230 V mains peaks at 325 V.'])}
${wx('Find the volume of a sphere of radius r by rotating y = √(r² − x²).',['V = ∫₋ᵣʳ π(r² − x²) dx.','= π[r²x − x³/3] from −r to r = π(2r³ − 2r³/3).','= (4/3)πr³.'])}
${co('EE connection','Average power p_avg = (1/T)∫v·i dt, RMS meters, energy stored in fields (½∫εE² dV), and charge delivered by a pulse all come from integrals. A "true-RMS" multimeter is a hardware integrator.')}`});

intapps:{f:['Area: ∫(top − bottom) dx','Disk: V = ∫π f² dx','f_avg = (1/(b − a))∫f dx','V_rms = √((1/T)∫v² dt)'],can:['Find areas between curves','Find volumes of revolution','Compute average and RMS values and variable-force work']}});

function mountDeck(el){

/* ===================== QUIZ RUNNER (review quiz + exam) ===================== */
function runQuiz(root,o){
  clearInterval(root._t);
  const st={qs:shuffle(Array.from({length:o.n},(_,i)=>o.ts[i%o.ts.length])).map(t=>makeQ(t)),ids:[],end:o.mins?Date.now()+o.mins*60000:0,done:false};
  root.innerHTML=`<div class="exam"><div class="timerbar"><span class="clock">${o.mins?o.mins+':00':'Untimed'}</span><span class="prog">0 of ${o.n} answered</span><button class="btn primary" data-q="sub">Submit</button></div>
  <div class="qlist">${st.qs.map((q,i)=>{const id='e'+(++uid);st.ids.push(id);return `<div class="qcard" data-c="${id}">${head(q,`<span class="qnum">Q${i+1}</span>`)}${qBody(q,id)}<div class="res"></div></div>`}).join('')}</div>
  <div class="actions qfoot"><button class="btn primary" data-q="sub">Submit</button><button class="btn" data-q="quit">${o.quitLabel||'Cancel'}</button></div></div>`;
  const card=id=>root.querySelector(`[data-c="${id}"]`);
  const upd=()=>{if(st.done)return;const a=st.qs.filter((q,i)=>readA(q,st.ids[i],card(st.ids[i]))!=null).length;root.querySelector('.prog').textContent=`${a} of ${o.n} answered`};
  root.oninput=upd;root.onchange=upd;
  root.onclick=e=>{const a=e.target.closest('[data-q]')?.dataset.q;if(!a)return;e.stopPropagation();if(a==='sub')submit();else if(a==='quit'||a==='back'){clearInterval(root._t);o.onBack()}else if(a==='again')runQuiz(root,o)};
  if(o.mins)root._t=setInterval(()=>{const left=Math.max(0,st.end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000),c=root.querySelector('.clock');if(!c||st.done){clearInterval(root._t);return}c.textContent=`${m}:${String(s).padStart(2,'0')} left`;c.classList.toggle('low',left<60000);if(left<=0)submit()},500);
  function submit(){
    if(st.done)return;st.done=true;clearInterval(root._t);const by={};let score=0;
    st.qs.forEach((q,i)=>{const id=st.ids[i],c=card(id),raw=readA(q,id,c),ok=grade(q,raw);if(ok)score++;record(q.topic,ok,q);
      const b=by[q.topic]||(by[q.topic]={r:0,n:0});b.n++;if(ok)b.r++;
      c.classList.add(ok?'right':'wrong');c.querySelectorAll('input').forEach(x=>x.disabled=true);
      c.querySelector('.res').innerHTML=`<div style="margin-bottom:10px"><span class="pill ${ok?'ok':'no'}">${ok?'✓ Correct':raw==null?'✗ Not answered':'✗ Incorrect'}</span></div>`+(ok?`<details class="why"><summary>Show worked solution</summary><div class="sol" style="margin-top:10px">${solHTML(q)}</div></details>`:`<div class="sol">${solHTML(q)}</div>`)});
    const n=st.qs.length,pct=Math.round(100*score/n);
    if(o.save){const hist=store.get('eeb.hist',[]);hist.unshift({d:new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}),s:score,n,sub:[...new Set(st.qs.map(q=>sName(tObj(q.topic).s)))].join(', ')});store.set('eeb.hist',hist.slice(0,20))}
    const weak=Object.entries(by).filter(([,b])=>b.r/b.n<.6).map(([t])=>tObj(t).name);
    const rep=document.createElement('div');rep.className='report';
    rep.innerHTML=`<div class="score"><b>${pct}%</b><span>${score} of ${n} correct</span></div><div class="pane" style="gap:12px"><div class="bars">${Object.entries(by).map(([t,b])=>`<div class="bar"><span>${tObj(t).name}</span><em>${b.r}/${b.n}</em><div class="tr"><i style="width:${100*b.r/b.n}%"></i></div></div>`).join('')}</div>
    <p style="margin:0">${weak.length?`Review next: <strong>${weak.join(', ')}</strong>. Missed questions are saved under Review → Mistakes to revisit for each subject.`:'Strong across every topic in this set. Try a longer exam or a tighter time limit.'}</p>
    <div class="actions"><button class="btn primary" data-q="again">Same settings, new questions</button><button class="btn" data-q="back">${o.backLabel||'Done'}</button></div></div>`;
    root.querySelector('.timerbar').replaceWith(rep);root.querySelector('.qfoot')?.remove();rep.scrollIntoView({block:'start'});
  }
}

      <label class="field"><span>Time limit</span><select id="e-t"><option value="0">No limit</option><option value="10">10 minutes</option><option value="20" selected>20 minutes</option><option value="30">30 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option></select></label>
      <button class="btn primary" id="e-go">Start exam</button>
    </div><p class="muted" id="e-msg" style="margin:0"></p>
  </div>
  <aside class="side"><h3>Past attempts</h3><div class="hist">${hist.length?hist.slice(0,8).map(h=>`<div><span>${h.d}${h.sub?`<small>${h.sub}</small>`:''}</span><b>${h.s}/${h.n} · ${Math.round(100*h.s/h.n)}%</b></div>`).join(''):'<p class="muted" style="margin:0">Your exam scores will be listed here.</p>'}</div></aside></div></div>`;
  $('#e-topics').addEventListener('click',e=>{const g=e.target.closest('[data-g]');if(g){g.closest('.egroup').querySelectorAll('[data-t]').forEach(c=>c.setAttribute('aria-pressed',g.dataset.g==='1'));return}
    const b=e.target.closest('[data-t]');if(b)b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')});
  $('#e-go').onclick=()=>{const ts=[...document.querySelectorAll('#e-topics [aria-pressed="true"]')].map(b=>b.dataset.t);
    if(!ts.length){$('#e-msg').textContent='Pick at least one topic to build an exam.';return}
    store.set('eeb.etopics',ts);root._busy=true;runQuiz(root,{ts,n:+$('#e-n').value,mins:+$('#e-t').value,save:true,quitLabel:'Abandon exam',backLabel:'Back to exam builder',onBack:()=>renderExamSetup()});window.scrollTo({top:0})};
}


/* ===================== HOME HUB ===================== */
function subjStats(id){let r=0,n=0;TOPICS.filter(t=>t.s===id).forEach(t=>{const x=stats[t.id];if(x){r+=x.r;n+=x.n}});const tried=TOPICS.filter(t=>t.s===id&&!t.pre&&stats[t.id]).length,tot=TOPICS.filter(t=>t.s===id&&!t.pre).length;return {r,n,tried,tot}}
function renderHome(){
  const M=store.get('eeb.miss',{}),hist=store.get('eeb.hist',[]),last=store.get('eeb.subj',null);
  const nMiss=Object.values(M).reduce((a,l)=>a+l.length,0);
  let tr=0,tn=0;Object.values(stats).forEach(x=>{tr+=x.r;tn+=x.n});
  const card=x=>{const st=subjStats(x.id),acc=st.n?Math.round(100*st.r/st.n):null,sec=SECS.find(k=>k[0]===(secs[x.id]||'theory'));
    return `<button class="hcard${x.id===last?' feature':''}" data-tab="${x.id}" type="button"><div class="hh">${subIco(x.id,1)}<div><h3>${x.name}</h3><div class="meta"><span class="badge n">${st.tot} topics</span>${x.id===last?'<span class="badge">Continue</span>':''}</div></div></div><p>${SUBMETA[x.id][2]}</p>
    <div class="mini"><div>Topics practised<b>${st.tried}/${st.tot}</b></div><div>Accuracy<b>${acc==null?'–':acc+'%'}</b></div><div class="tr"><i style="width:${st.tot?100*st.tried/st.tot:0}%"></i></div></div><span class="go">${st.n?`Resume ${sec[1].toLowerCase()} →`:'Start with prior knowledge →'}</span></button>`};
  $('#home').innerHTML=`<div class="hub">
   <div class="hero"><div class="eyebrow">Explore EE Study Bench</div><h1>Your first year,<br>all in one place</h1><p>Each subject runs in four steps: refresh prior knowledge, read illustrated theory, practise unlimited worked problems, then review. Build timed exams across any mix of topics when you are ready.</p>
    <div class="actions"><button class="btn primary" data-tab="${last||'circuits'}" type="button">${last?'Continue '+sName(last):'Start with Circuits'}</button><button class="btn" data-tab="exam" type="button">Build a practice exam</button></div></div>
   <section><div class="secth">Subjects</div><div class="hubgrid">${SUBJECTS.map(card).join('')}</div></section>
   <section><div class="secth">Your progress</div><div class="hubgrid">
    <div class="hcard" style="cursor:default"><div class="hh"><span class="ico lg c-green">✓</span><div><h3>Questions answered</h3><div class="meta"><span class="badge">All subjects</span></div></div></div><div class="mini"><div>Answered<b>${tn}</b></div><div>Correct<b>${tr}</b></div><div>Accuracy<b>${tn?Math.round(100*tr/tn)+'%':'–'}</b></div></div></div>
    <div class="hcard" style="cursor:default"><div class="hh"><span class="ico lg c-clay">!</span><div><h3>Mistakes to revisit</h3><div class="meta"><span class="badge n">${nMiss} saved</span></div></div></div><p>${nMiss?'Open a subject\'s Review step to retry the questions you missed.':'Questions you get wrong are saved here, by subject, for review.'}</p>
     <div class="actions">${SUBJECTS.filter(x=>(M[x.id]||[]).length).map(x=>`<button class="btn" data-go="${x.id}:review" type="button">${x.name} (${M[x.id].length})</button>`).join('')||''}</div></div>
    <div class="hcard" style="cursor:default"><div class="hh"><span class="ico lg c-indigo">${'⏱'}</span><div><h3>Recent exams</h3><div class="meta"><span class="badge n">${hist.length} taken</span></div></div></div>${hist.length?`<div class="mini">${hist.slice(0,4).map(h=>`<div>${h.d}<b>${Math.round(100*h.s/h.n)}%</b></div>`).join('')}</div>`:'<p>Timed exams you take are scored and listed here.</p>'}<div class="actions"><button class="btn" data-tab="exam" type="button">Build an exam</button></div></div>
   </div></section></div>`;
}

/* ===================== SEARCH ===================== */
let qSel=0;
function closeSearch(){const r=$('#qres');if(r)r.hidden=true}
function runSearch(){
  const v=$('#q').value.trim().toLowerCase(),r=$('#qres');
  if(!v){r.hidden=true;return}
  const hits=TOPICS.map(t=>{const n=t.name.toLowerCase(),sn=sName(t.s).toLowerCase(),i=n.indexOf(v);return {t,score:i===0?0:i>0?1:sn.includes(v)?2:(t.g||'').toLowerCase().includes(v)?3:9}}).filter(x=>x.score<9).sort((a,b)=>a.score-b.score).slice(0,9);
  qSel=0;r.hidden=false;
  r.innerHTML=hits.length?hits.map((x,i)=>`<button type="button" class="${i?'':'on'}" data-hit="${x.t.s}:${x.t.pre?'prior':'theory'}:${x.t.pre?'':x.t.id}">${subIco(x.t.s)}${x.t.pre?'Prior knowledge: ':''}${x.t.name}<small>${sName(x.t.s)}</small></button>`).join(''):`<div class="none">No topics match “${esc(v)}”.</div>`;
}
document.addEventListener('input',e=>{if(e.target.id==='q')runSearch()});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus();return}
  if(e.target.id!=='q')return;const bs=[...document.querySelectorAll('#qres [data-hit]')];
  if(e.key==='Escape'){$('#q').value='';closeSearch();$('#q').blur()}
  else if((e.key==='ArrowDown'||e.key==='ArrowUp')&&bs.length){e.preventDefault();qSel=(qSel+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('on',i===qSel))}
  else if(e.key==='Enter'&&bs[qSel]){e.preventDefault();bs[qSel].click()}
});
document.addEventListener('click',e=>{
  const h=e.target.closest('[data-hit]');if(h){const [s2,k,t]=h.dataset.hit.split(':');$('#q').value='';closeSearch();go(s2,k,t||undefined);return}
  if(!e.target.closest('.search'))closeSearch();
},true);

/* ===================== THEME ===================== */
function applyTheme(m){const r=document.documentElement;if(m==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',m);$('#themelab').textContent='Theme: '+m}
function initTheme(){applyTheme(store.get('eeb.theme','system'));$('#themebtn2').onclick=()=>$('#themebtn').click();$('#themebtn').onclick=()=>{const order=['system','light','dark'],cur=store.get('eeb.theme','system'),nx=order[(order.indexOf(cur)+1)%3];store.set('eeb.theme',nx);applyTheme(nx)}}

/* ===================== BOOT ===================== */
(function boot(){
  const h=location.hash.slice(1).split('-');
  view='home';
  if(h[0]==='exam')view='exam';
  else if(SUBJECTS.some(s=>s.id===h[0])){view='subject';subj=h[0];if(SECS.some(s=>s[0]===h[1]))secs[subj]=h[1]}
  initTheme();renderSubjNav();renderSubject();renderExamSetup(true);show();
})();

</script>

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
