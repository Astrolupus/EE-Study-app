<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EE Study Bench</title>
<meta name="description" content="Theory, practice problems, review and timed exams for first-year electrical engineering.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EE Bench">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0}img{max-width:100%}</style>
</head>
<body>
<style>
/* Layout: app shell in the Crameleon manner. A fixed left sidebar (brand, Home, subjects with tinted icon tiles, exam, theme), a slim top bar (location, topic search, exam CTA), and a warm-neutral main canvas of 12px-radius bordered cards with a single green accent. */
:root{
  --paper:#faf9f5; --side:#f3f2ec; --panel:#ffffff; --raised:#f0efe9; --ink:#201f1c; --muted:#6e6b62; --faint:#9a968c; --line:#e7e5de;
  --grid:#201f1c0a; --grid2:#201f1c1c;
  --accent:#2f8342; --accent-hover:#217737; --copper:#237939; --on-copper:#ffffff; --copper-soft:rgba(47,131,66,.1);
  --codebg:#f6f5f0; --tk-fn:#1f6a8a; --tk-str:#4d7a1c; --tk-num:#8a3f8f;
  --good:#237939; --good-bg:rgba(47,131,66,.1); --bad:#b4372c; --bad-bg:rgba(180,55,44,.09);
  --t-amber:#faf5e0; --t-clay:#fde6de; --t-cyan:#e0fbfb; --t-indigo:#dbf0fd; --t-magenta:#fdedfe; --t-green:#e2f2e5;
  --i-amber:#9a7000; --i-clay:#b4502f; --i-cyan:#13807f; --i-indigo:#2b68a3; --i-magenta:#9b3f97; --i-green:#237939;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --rs:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131210; --side:#1b1a17; --panel:#1b1a17; --raised:#23221d; --ink:#f0efea; --muted:#a8a49b; --faint:#736f66; --line:#2b2a25;
  --grid:#f0efea08; --grid2:#f0efea1a;
  --accent:#318544; --accent-hover:#26783b; --copper:#5fa069; --on-copper:#ffffff; --copper-soft:rgba(95,160,105,.13);
  --codebg:#171613; --tk-fn:#6cb8d8; --tk-str:#a9cc6e; --tk-num:#d79ad9;
  --good:#6faf78; --good-bg:rgba(95,160,105,.13); --bad:#e5776b; --bad-bg:rgba(229,119,107,.12);
  --t-amber:#34301f; --t-clay:#382a22; --t-cyan:#1f3436; --t-indigo:#25303d; --t-magenta:#372a38; --t-green:#1f3324;
  --i-amber:#e0bd5a; --i-clay:#e79a7c; --i-cyan:#6fcfcf; --i-indigo:#86b6e6; --i-magenta:#d996d4; --i-green:#6faf78;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131210; --side:#1b1a17; --panel:#1b1a17; --raised:#23221d; --ink:#f0efea; --muted:#a8a49b; --faint:#736f66; --line:#2b2a25;
  --grid:#f0efea08; --grid2:#f0efea1a;
  --accent:#318544; --accent-hover:#26783b; --copper:#5fa069; --on-copper:#ffffff; --copper-soft:rgba(95,160,105,.13);
  --codebg:#171613; --tk-fn:#6cb8d8; --tk-str:#a9cc6e; --tk-num:#d79ad9;
  --good:#6faf78; --good-bg:rgba(95,160,105,.13); --bad:#e5776b; --bad-bg:rgba(229,119,107,.12);
  --t-amber:#34301f; --t-clay:#382a22; --t-cyan:#1f3436; --t-indigo:#25303d; --t-magenta:#372a38; --t-green:#1f3324;
  --i-amber:#e0bd5a; --i-clay:#e79a7c; --i-cyan:#6fcfcf; --i-indigo:#86b6e6; --i-magenta:#d996d4; --i-green:#6faf78;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tblogo,.iconbtn{display:none}
.iconbtn{flex:none;width:36px;height:36px;border-radius:var(--rs);border:1px solid var(--line);background:var(--panel);color:var(--muted);place-items:center;cursor:pointer}
.iconbtn svg{width:17px;height:17px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.1;margin:0;letter-spacing:-.01em}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* app shell */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.sidenav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 12px 14px max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.brand b{font-family:var(--display);font-size:1.32rem;font-weight:700;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-size:.7rem;color:var(--muted);margin-top:2px;font-weight:450}
.navlab{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:var(--rs);padding:7px 10px;color:var(--muted);font-size:.9rem;font-weight:450;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--raised);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--raised);color:var(--ink);font-weight:550}
.tab .cnt{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--faint)}
.ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;font-family:var(--mono);font-size:.78rem;font-weight:600;line-height:1}
.ico.lg{width:38px;height:38px;border-radius:10px;font-size:1.02rem}
.ico svg{width:15px;height:15px}
.ico.lg svg{width:20px;height:20px}
.c-amber{background:var(--t-amber);color:var(--i-amber)}.c-clay{background:var(--t-clay);color:var(--i-clay)}.c-cyan{background:var(--t-cyan);color:var(--i-cyan)}.c-indigo{background:var(--t-indigo);color:var(--i-indigo)}.c-magenta{background:var(--t-magenta);color:var(--i-magenta)}.c-green{background:var(--t-green);color:var(--i-green)}
.sidefoot{margin-top:auto;padding-top:12px;display:grid;gap:2px}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.crumb{font-size:.88rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--ink);font-weight:550}
.search{position:relative;margin-left:auto;width:min(340px,40vw)}
.search input{width:100%;font:inherit;font-size:.88rem;padding:7px 12px 7px 32px;border-radius:var(--rs);border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.68rem;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--raised)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;display:grid;gap:2px;max-height:60vh;overflow:auto}
.results button{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:transparent;border:0;border-radius:var(--rs);padding:7px 8px;color:var(--ink);cursor:pointer;font-size:.88rem}
.results button:hover,.results button.on{background:var(--raised)}
.results small{margin-left:auto;color:var(--faint);font-size:.75rem}
.results .none{padding:10px;color:var(--muted);font-size:.86rem}
.topcta{white-space:nowrap}
.badge{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,var(--copper) 45%,transparent);color:var(--copper);border-radius:999px;padding:1px 7px;font-size:.62rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;line-height:1.5;white-space:nowrap}
.badge.n{border-color:var(--line);color:var(--muted)}
/* home hub */
.hub{display:flex;flex-direction:column;gap:30px}
.hero h1{font-size:2.5rem;font-weight:700;margin-top:6px}
.hero p{margin:10px 0 0;max-width:60ch;color:var(--muted);font-size:1rem}
.hero .actions{margin-top:18px}
.secth{font-family:var(--display);font-size:1.35rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.01em;margin-bottom:12px}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s}
.hcard:hover{border-color:color-mix(in srgb,var(--copper) 55%,var(--line))}
.hcard .hh{display:flex;gap:12px;align-items:center}
.hcard h3{font-family:var(--body);font-size:1rem;font-weight:600;letter-spacing:0;line-height:1.3}
.hcard .meta{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.hcard p{margin:0;font-size:.88rem;color:var(--muted)}
.hcard .go{margin-top:auto;font-size:.84rem;color:var(--copper);font-weight:550}
.mini{background:var(--paper);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;display:grid;gap:6px;font-size:.8rem}
.mini div{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.mini div b{color:var(--ink);font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.mini .tr{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.mini .tr i{display:block;height:100%;background:var(--accent)}
.hcard.feature{border-color:color-mix(in srgb,var(--copper) 45%,var(--line));box-shadow:inset 3px 0 0 var(--accent)}

main{padding-block:26px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}
.stepbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;margin-bottom:28px;background:var(--side);border:1px solid var(--line);border-radius:var(--r)}
.step{display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--rs);padding:8px 10px;cursor:pointer;color:var(--muted);min-width:0;font:inherit}
.step:hover{background:var(--panel);color:var(--ink)}
.step b{display:block;font-size:.9rem;font-weight:600;color:inherit;line-height:1.25}
.step small{display:block;font-size:.74rem;line-height:1.3;color:var(--faint)}
.step .sn{flex:none;width:24px;height:24px;border-radius:7px;background:var(--raised);display:grid;place-items:center;font-family:var(--mono);font-size:.74rem}
.step[aria-current="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.step[aria-current="true"] .sn{background:var(--accent);color:#fff}
.stepfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:40px;align-items:start}
.twocol>.side{position:sticky;top:16px}
.linklist{display:grid;gap:6px}
.lk{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--rs);font:inherit;padding:9px 12px;cursor:pointer;color:var(--ink)}
.lk:hover{border-color:var(--copper)}
.lk b{display:block;font-weight:600}
.lk small{color:var(--muted);font-size:.78rem}
.ladder{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;max-width:640px}
.ladder div{border:1px solid var(--line);border-radius:4px;background:var(--panel);text-align:center;padding:8px 2px}
.ladder b{display:block;font-family:var(--mono);font-size:1.3rem;color:var(--copper)}
.ladder span{display:block;font-size:.75rem}
.ladder small{display:block;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.revgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.rec{margin:0}
.revh{font-family:var(--body);font-size:1.12rem;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.revh .count{font-family:var(--mono);font-size:.72rem;border:1px solid color-mix(in srgb,var(--copper) 45%,transparent);color:var(--copper);border-radius:999px;padding:1px 8px}
.revcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.revcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.revcard h4{margin:0;font-size:1rem;font-weight:600}
.fl{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.fl li{font-family:var(--mono);font-size:.82rem;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:5px 8px;overflow-wrap:anywhere}
.can{display:grid;gap:6px;font-size:.92rem}
.can label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.can input{margin-top:4px;accent-color:var(--accent)}
.revcard .actions{margin-top:auto}
.revcard .btn.ghost{padding:4px 0;margin-right:12px}
.worked{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px 18px;max-width:72ch;display:grid;gap:8px}
.worked p{margin:0;font-weight:500}
details.deriv{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:0 18px;max-width:72ch}
details.deriv summary{cursor:pointer;padding:12px 0;font-weight:600;color:var(--copper)}
details.deriv>div{padding-bottom:14px}
details.deriv p{margin:0}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center}
.subjbar{display:flex;align-items:center;gap:4px 6px;flex-wrap:wrap;padding-block:16px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.subjbar .eyebrow{margin-right:8px}
.subj{background:transparent;border:0;border-radius:6px;padding:7px 12px;font-family:var(--display);font-size:1.08rem;font-weight:600;letter-spacing:.03em;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.subj small{font-family:var(--mono);font-size:.7rem;font-weight:400;opacity:.75}
.subj:hover{color:var(--ink);background:var(--panel)}
.subj[aria-pressed="true"]{color:var(--paper);background:var(--ink)}
.tocgrp{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:16px 12px 6px}
.tocgrp:first-child{padding-top:0}
.egroups{display:grid;gap:14px}
.egh{display:flex;gap:12px;align-items:baseline;margin-bottom:8px}
.egh b{font-size:.95rem;font-weight:600}
.hist small{display:block;color:var(--muted);font-size:.75rem}
pre.code{margin:0;font-family:var(--mono);font-size:.88rem;line-height:1.6;background:var(--codebg);border:1px solid var(--line);border-radius:var(--rs);padding:14px 16px;overflow-x:auto;tab-size:4;color:var(--ink);max-width:100%}
pre.code .k{color:var(--copper);font-weight:500}
pre.code .b{color:var(--tk-fn)}
pre.code .s{color:var(--tk-str)}
pre.code .n{color:var(--tk-num)}
pre.code .c{color:var(--muted);font-style:italic}
code{font-family:var(--mono);font-size:.92em}
.int{display:inline-flex;align-items:center;font-size:1.15em;white-space:nowrap}
.lim{display:inline-flex;flex-direction:column;font-size:.6em;line-height:1.05;margin:0 .25em 0 .05em}
.lim sup,.lim sub{vertical-align:baseline;font-size:1em}
.idx{display:grid;gap:4px;max-width:480px}
.idx div{border:1px solid var(--line);border-radius:4px;text-align:center;padding:6px 0;background:var(--panel);font-family:var(--mono)}
.idx b{display:block;font-size:1.2rem}
.idx small{display:block;color:var(--muted);font-size:.7rem}
.idx small.neg{color:var(--copper)}
.eyebrow{font-size:.7rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 13px;font:inherit;font-size:.85rem;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--copper-soft);color:var(--copper);border-color:color-mix(in srgb,var(--copper) 50%,transparent);font-weight:550}

/* buttons */
.btn{border:1px solid transparent;background:var(--raised);color:var(--ink);border-radius:var(--rs);padding:8px 15px;font:inherit;font-size:.88rem;font-weight:550;cursor:pointer}
.btn:hover{border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--copper)}
.btn.ghost:hover{text-decoration:underline}

/* question card */
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-size:.66rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--copper);border:1px solid color-mix(in srgb,var(--copper) 45%,transparent);padding:1px 8px;border-radius:999px}
.kind{font-size:.66rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:1px 8px;border-radius:999px}
.qnum{font-family:var(--display);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
.prompt{font-size:1.06rem;max-width:68ch}
.prompt b{font-family:var(--mono);font-weight:500;font-size:.95em;white-space:nowrap}
.fig{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:var(--rs);padding:14px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.fig figcaption{font-size:.85rem;color:var(--muted);margin-top:8px;text-align:center}
.ans label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.ansrow{display:flex;align-items:stretch;max-width:360px}
.inp{flex:1;min-width:0;font-family:var(--mono);font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:var(--rs) 0 0 var(--rs);background:var(--paper);color:var(--ink)}
.inp:only-child{border-radius:var(--rs)}
.unit{font-family:var(--mono);padding:10px 12px;border:1px solid var(--line);border-left:0;border-radius:0 var(--rs) var(--rs) 0;background:var(--raised);color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px}

<script>
/* ---------- utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);

const E12=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];

const T=(x,y,c,a='middle',cls='')=>`<text x="${x}" y="${y}" text-anchor="${a}" ${cls?`class="${cls}"`:''}>${c}</text>`;
function lab(x,y,n,v,a='middle'){return T(x,y,`<tspan class="nm">${n}</tspan>`,a)+(v!=null?T(x,y+16,`<tspan class="val">${v}</tspan>`,a):'')}

function figLoop(src,r){return svg(400,200,Vs(50,Y2,50,Y1)+lab(82,110,...src,'start')+W([[50,Y1],[300,Y1]])+R(300,Y1,300,Y2)+lab(316,110,...r,'start')+W([[300,Y2],[50,Y2]]),'Single-loop circuit: source and resistor')}
function figSeries3(src,r){return svg(440,200,Vs(50,Y2,50,Y1)+lab(82,110,...src,'start')+R(50,Y1,180,Y1)+lab(115,16,...r[0])+R(180,Y1,310,Y1)+lab(245,16,...r[1])+R(310,Y1,310,Y2)+lab(326,110,...r[2],'start')+W([[310,Y2],[50,Y2]]),'Three resistors in series with a source')}
function figParallel(src,rs,isI){
  const xs=rs.length===2?[190,330]:[170,280,390],last=xs[xs.length-1];let s='';
  if(src){s+=(isI?Is:Vs)(50,Y2,50,Y1)+lab(82,110,...src,'start')}
  else{s+=term(50,Y1)+term(50,Y2)+T(36,Y1+5,'a','end')+T(36,Y2+5,'b','end')+T(60,120,'R<tspan dy="4" font-size="10">eq</tspan><tspan dy="-4"> → ?</tspan>','start','val')}
  s+=W([[src?50:54,Y1],[last,Y1]])+W([[last,Y2],[src?50:54,Y2]]);
  xs.forEach((x,i)=>{s+=R(x,Y1,x,Y2)+lab(x+14,110,...rs[i],'start');if(x!==last)s+=dot(x,Y1)+dot(x,Y2)});
  return svg(last+96,200,s,'Resistors in parallel');
}
function figSP(src,r){return svg(440,200,Vs(50,Y2,50,Y1)+lab(82,110,...src,'start')+R(50,Y1,190,Y1)+lab(120,16,...r[0])+R(190,Y1,190,Y2)+lab(204,110,...r[1],'start')+W([[190,Y1],[330,Y1]])+R(330,Y1,330,Y2)+lab(344,110,...r[2],'start')+W([[330,Y2],[50,Y2]])+dot(190,Y1)+dot(190,Y2),'R1 in series with R2 parallel R3')}

function figRC(src,r,c,isL){return svg(440,200,Vs(50,Y2,50,Y1)+lab(82,110,...src,'start')+W([[50,Y1],[100,Y1]])+`<circle class="term" cx="100" cy="${Y1}" r="3.5"/><circle class="term" cx="140" cy="${Y1}" r="3.5"/><path class="w" d="M102 ${Y1-2}L136 ${Y1-20}"/>`+T(120,16,'t = 0','middle','tick')+R(140,Y1,320,Y1)+lab(230,16,...r)+(isL?Ind:C)(320,Y1,320,Y2)+lab(338,110,...c,'start')+W([[320,Y2],[50,Y2]]),isL?'RL circuit with switch':'RC circuit with switch')}
function figTwoSrc(v1,r1,v2,r2,opp){return svg(440,226,Vs(50,Y2,50,Y1)+lab(82,110,...v1,'start')+R(50,Y1,320,Y1)+lab(185,16,...r1)+(opp?Vs(320,Y2,320,Y1):Vs(320,Y1,320,Y2))+lab(352,110,...v2,'start')+R(320,Y2,50,Y2)+lab(185,202,...r2)+`<path class="arrl" d="M150 ${Y1+28}H214"/><path class="arr" d="M222 ${Y1+28}l-10 -5v10z"/>`+T(185,Y1+48,'I','middle','val'),'Two-source series loop')}
function figKCL(br){
  const N=[200,112],ends=[[60,112],[340,112],[200,24],[200,200]],labs=[[130,94,'middle'],[270,94,'middle'],[214,66,'start'],[214,164,'start']];let s='';
  br.forEach((b,i)=>{const E=ends[i];s+=W([N,E]);const mx=(N[0]+E[0])/2,my=(N[1]+E[1])/2;let dx=N[0]-E[0],dy=N[1]-E[1];const L=Math.hypot(dx,dy);dx/=L;dy/=L;if(b.dir==='out'){dx=-dx;dy=-dy}
    const nx=-dy,ny=dx;s+=`<path class="arr" d="M${mx+dx*8} ${my+dy*8}L${mx-dx*6+nx*6} ${my-dy*6+ny*6}L${mx-dx*6-nx*6} ${my-dy*6-ny*6}z"/>`;

/* ---------- plots ---------- */
function axes(o){
  const {w,h,ml=52,mr=16,mt=22,mb=40,x0,x1,y0,y1}=o;
  const sx=x=>ml+(x-x0)/(x1-x0)*(w-ml-mr),sy=y=>h-mb-(y-y0)/(y1-y0)*(h-mt-mb);let s='';
  (o.xt||[]).forEach(([v,l])=>{s+=`<line class="grid" x1="${sx(v)}" y1="${mt}" x2="${sx(v)}" y2="${h-mb}"/>`+T(sx(v),h-mb+16,l,'middle','tick')});
  (o.yt||[]).forEach(([v,l])=>{s+=`<line class="grid" x1="${ml}" y1="${sy(v)}" x2="${w-mr}" y2="${sy(v)}"/>`+T(ml-8,sy(v)+4,l,'end','tick')});
  if(!o.noBox)s+=`<path class="axis" d="M${ml} ${mt}V${h-mb}H${w-mr}"/>`;
  if(o.xl)s+=T(w-mr,h-4,o.xl,'end','tick');
  if(o.yl)s+=T(ml,mt-8,o.yl,'start','tick');
  return {sx,sy,s};
}
const fnPath=(f,a,b,sx,sy,n=160)=>{let d='';for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;d+=(i?'L':'M')+sx(x).toFixed(1)+' '+sy(f(x)).toFixed(1)}return d};
function figCharge(){
  const A=axes({w:540,h:270,x0:0,x1:5,y0:0,y1:1.05,xt:[0,1,2,3,4,5].map(k=>[k,k?k+'τ':'0']),yt:[[0,'0%'],[.25,'25%'],[.5,'50%'],[.75,'75%'],[1,'100%']],xl:'time t',yl:'v_C as % of Vs'});
  let s=A.s+`<path class="c1" d="${fnPath(x=>1-Math.exp(-x),0,5,A.sx,A.sy)}"/><path class="c2" d="${fnPath(x=>Math.exp(-x),0,5,A.sx,A.sy)}"/>`;
  [1,2,3,4,5].forEach(k=>s+=`<circle class="pt" cx="${A.sx(k)}" cy="${A.sy(1-Math.exp(-k))}" r="4"/>`);
  s+=T(A.sx(1.12),A.sy(.58),'63.2% after one τ','start','val')+T(A.sx(2.2),A.sy(.74),'charging: Vs(1 − e^(−t/τ))','start')+T(A.sx(1.55),A.sy(.3),'discharging: V0·e^(−t/τ)','start');
  return svg(540,270,s,'RC charging and discharging curves');
}
function figSine(){
  const A=axes({w:540,h:250,x0:0,x1:1.5,y0:-1.32,y1:1.3,ml:62,mb:30,noBox:true,xt:[[0,'0'],[.25,'T/4'],[.5,'T/2'],[.75,'3T/4'],[1,'T']],yt:[[-1,'−Vp'],[0,'0'],[.707,'0.707Vp'],[1,'Vp']]});
  const {sx,sy}=A;let s=A.s+`<path class="axis" d="M${sx(0)} ${sy(1.3)}V${sy(-1.32)}M${sx(0)} ${sy(0)}H${sx(1.5)}"/>`;
  s+=`<line class="ref" x1="${sx(0)}" x2="${sx(1.25)}" y1="${sy(1)}" y2="${sy(1)}"/><line class="ref" x1="${sx(0)}" x2="${sx(1.25)}" y1="${sy(.707)}" y2="${sy(.707)}"/>`;
  s+=`<path class="c1" d="${fnPath(x=>Math.sin(2*Math.PI*x),0,1.25,sx,sy)}"/>`;
  s+=T(sx(.52),sy(1)-6,'peak Vp','start')+T(sx(.52),sy(.707)-6,'Vrms = Vp / √2','start','val');
  s+=`<path class="arrl" d="M${sx(1.36)} ${sy(1)+8}V${sy(-1)-8}"/><path class="arr" d="M${sx(1.36)} ${sy(1)}l-5 9h10z"/><path class="arr" d="M${sx(1.36)} ${sy(-1)}l-5 -9h10z"/>`+T(sx(1.39),sy(0)+4,'Vpp','start','val');
  s+=`<path class="arrl" d="M${sx(0)+8} ${sy(-1.17)}H${sx(1)-8}"/><path class="arr" d="M${sx(0)} ${sy(-1.17)}l9 -5v10z"/><path class="arr" d="M${sx(1)} ${sy(-1.17)}l-9 -5v10z"/>`+T(sx(.38),sy(-1.17)-6,'period T = 1/f','middle');
  return svg(540,250,s,'Sine wave showing peak, RMS, peak-to-peak and period');
}
function figVI(){
  const A=axes({w:460,h:250,x0:0,x1:10,y0:0,y1:10,xt:[0,2,4,6,8,10].map(v=>[v,v]),yt:[0,2,4,6,8,10].map(v=>[v,v]),xl:'V (volts)',yl:'I (mA)'});
  let s=A.s+`<path class="c1" d="M${A.sx(0)} ${A.sy(0)}L${A.sx(10)} ${A.sy(10)}"/><path class="c2" d="M${A.sx(0)} ${A.sy(0)}L${A.sx(10)} ${A.sy(5)}"/>`;
  s+=T(A.sx(8.6),A.sy(9.6),'R = 1 kΩ','end','val')+T(A.sx(9.8),A.sy(3.4),'R = 2 kΩ','end');
  return svg(460,250,s,'Current versus voltage for 1 kilo-ohm and 2 kilo-ohm resistors');
}

function makeQ(topic){
  let q;
  if(BANK[topic]&&Math.random()<.25){const [p,c,w]=pick(BANK[topic]);const ch=shuffle(c);q={kind:'mcq',prompt:p,choices:ch,answer:ch.indexOf(c[0]),steps:[w],concept:true}}
  else q=pick(G[topic])();
  q.topic=topic;return q;
}

/* ---------- question card ---------- */
let uid=0;
function qBody(q,id){
  let inp;
  if(q.kind==='mcq')inp=`<fieldset class="choices"><legend class="sr">Choose one answer</legend>${q.choices.map((c,j)=>`<label class="choice"><input type="radio" name="${id}" value="${j}" id="${id}-${j}"><span>${c}</span></label>`).join('')}</fieldset>`;
  else inp=`<div class="ans"><label for="${id}">Your answer${q.unit?' in '+q.unit:''}</label><div class="ansrow"><input id="${id}" class="inp" autocomplete="off" spellcheck="false" placeholder="${q.ph||'e.g. 2.2m or 0.0022'}">${q.unit?`<span class="unit">${q.unit}</span>`:''}</div>${q.kind==='num'&&q.tol!==0?'<div class="hint">SI prefixes work: p n µ (or u) m k M. Within 2% counts as correct.</div>':''}</div>`;
  return `<div class="prompt">${q.prompt}</div>${q.code?`<pre class="code">${hl(q.code)}</pre>`:''}${q.fig?`<div class="fig">${q.fig}</div>`:''}${inp}`;
}
function readA(q,id,root){if(q.kind==='mcq'){const r=root.querySelector(`input[name="${id}"]:checked`);return r?+r.value:null}const v=root.querySelector('#'+id).value.trim();return v===''?null:v}
function grade(q,raw){
  if(raw==null)return false;
  if(q.kind==='mcq')return raw===q.answer;
  if(q.kind==='text'){const n=s=>String(s).replace(/[\s_]/g,'').replace(/^0x/i,'').replace(/^0+(?=.)/,'').toUpperCase();return n(raw)===n(q.answer)}
  if(q.kind==='out'){const n=s=>String(s).replace(/\s+/g,'').replace(/["']/g,'').toLowerCase();return n(raw)===n(q.answer)}
  const x=parseNum(raw,q.unit);if(isNaN(x))return false;const tol=q.tol??.02;
  return tol===0?Math.abs(x-q.answer)<1e-9:Math.abs(x-q.answer)<=tol*Math.abs(q.answer)+(q.abs||1e-18);
}
const ansText=q=>q.kind==='mcq'?q.choices[q.answer]:(q.kind==='text'||q.kind==='out')?`<code>${esc(String(q.answer))}</code>`:(q.tol===0?String(q.answer):eng(q.answer,q.unit,q.tol!=null&&q.tol<.005?5:3));
const solHTML=q=>`<p class="final">Answer: <b>${ansText(q)}</b></p><ol class="steps">${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`;
const head=(q,extra='')=>`<div class="qhead">${extra}<span class="tag">${tName(q.topic)}</span><span class="kind">${q.kind==='mcq'?(q.concept?'Concept':'Choose one'):'Calculation'}</span></div>`;

function mountCard(el,getQ,onResult,empty){
  let q,id,done=false;
  function load(){q=getQ();id='q'+(++uid);done=false;if(!q){el.innerHTML=`<div class="empty">${empty||'Nothing here yet.'}</div>`;return}
    el.innerHTML=`<div class="qcard">${head(q)}${qBody(q,id)}<div class="actions"><button class="btn primary" data-a="check">Check answer</button><button class="btn" data-a="show">Show solution</button><button class="btn ghost" data-a="next">New question →</button></div><div class="fb" aria-live="polite"></div><div class="sol" hidden></div></div>`}
  function reveal(){const s=el.querySelector('.sol');s.innerHTML=solHTML(q);s.hidden=false}
  function check(){const raw=readA(q,id,el),fb=el.querySelector('.fb');
    if(raw==null){fb.innerHTML=`<span class="pill no">Enter an answer first.</span>`;return}
    if(q.kind==='num'&&isNaN(parseNum(raw,q.unit))){fb.innerHTML=`<span class="pill no">That isn't a number. Try something like 4.7k or 0.0047.</span>`;return}
    const ok=grade(q,raw);
    fb.innerHTML=ok?`<span class="pill ok">✓ Correct</span>`:`<span class="pill no">✗ Not quite. Try again or show the solution.</span>`;
    if(!done){done=true;onResult&&onResult(q.topic,ok,q)}
    if(ok)reveal();
  }
  el.addEventListener('click',e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(a==='check')check();else if(a==='show'){if(!done){done=true;onResult&&onResult(q.topic,false,q)}reveal()}else if(a==='next')load()});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('inp')){e.preventDefault();check()}});
  load();
  return {load};
}

const sheet=(cap,rows)=>`<div class="sheet"><table><caption>${cap}</caption><thead><tr><th>Quantity</th><th>Formula</th><th>Notes</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="eq">${r[1]}</td><td class="u">${r[2]}</td></tr>`).join('')}</tbody></table></div>`;
const fig=(s,cap)=>`<figure class="fig" style="margin:0">${s}${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`;
const NOTES={
ohm:()=>`<p class="lede">Ohm's law links the three quantities you will use in every circuit: voltage pushes, current flows, resistance opposes.</p>
${sheet('Formula sheet',[['Ohm\'s law','V = I·R','V in volts (V), I in amperes (A), R in ohms (Ω)'],['Power','P = V·I','watts (W): the rate energy is converted'],['Power, from I','P = I²·R','use when current is known'],['Power, from V','P = V²/R','use when voltage is known'],['Energy','W = P·t','joules (J); 1 kWh = 3.6 MJ'],['Conductance','G = 1/R','siemens (S)']])}
<h3>Reading the V–I graph</h3>
<p>A resistor's current rises in a straight line with voltage. The slope of an I–V plot is 1/R, so a steeper line means a <em>smaller</em> resistance.</p>
${fig(figVI(),'Same voltage, double the resistance, half the current.')}
<h3>Passive sign convention</h3>
<p>Label the voltage with + and − and draw the current arrow entering the + terminal. If the product <i class="v">p = v·i</i> comes out positive, the element absorbs power; negative means it supplies power. Resistors always absorb; a battery being discharged supplies.</p>
<div class="callout"><strong>Worked example</strong>A 12 V supply drives a 470 Ω resistor. I = 12/470 = 25.5 mA. P = V²/R = 144/470 = 0.306 W, which exceeds a ¼ W resistor's rating, so use a ½ W part.</div>
<h3>Common mistakes</h3>
<ul><li>Mixing mA and A: 25 mA is 0.025 A, not 25 A.</li><li>Squaring the wrong quantity: in I²R, only the current is squared.</li><li>Forgetting to check the resistor's power rating (¼ W, ½ W, 1 W).</li></ul>`,
series:()=>`<p class="lede">Reducing a network to a single equivalent resistance is the first move in almost every circuit problem.</p>
<div class="figrow">${fig(figSeries3(['Vs','12 V'],[['R1','1 kΩ'],['R2','2.2 kΩ'],['R3','3.3 kΩ']]),'Series: one path, same current everywhere.')}${fig(figParallel(['Vs','12 V'],[['R1','1 kΩ'],['R2','2.2 kΩ']]),'Parallel: same two nodes, same voltage across each.')}</div>
${sheet('Formula sheet',[['Series','Req = R1 + R2 + …','Req is larger than the largest resistor'],['Parallel','1/Req = 1/R1 + 1/R2 + …','Req is smaller than the smallest resistor'],['Two in parallel','Req = R1·R2 / (R1 + R2)','"product over sum"'],['n equal resistors','series: nR · parallel: R/n','quick mental check']])}
<h3>How to spot each connection</h3>
<ul><li><strong>Series:</strong> two elements share exactly one node and nothing else connects to that node.</li><li><strong>Parallel:</strong> both ends of the elements connect to the same pair of nodes. Redraw the circuit if wires make this hard to see.</li></ul>
<div class="callout"><strong>Worked example</strong>R1 = 1 kΩ in series with (R2 = 2.2 kΩ ‖ R3 = 3.3 kΩ). R2‖R3 = 7.26/5.5 = 1.32 kΩ. Total = 1 + 1.32 = 2.32 kΩ. Work from the far end of the circuit back towards the source.</div>`,
divider:()=>`<p class="lede">Dividers let you find one voltage or current without solving the whole circuit.</p>
${fig(figThev(['Vs','12 V'],['R1','10 kΩ'],['R2','4.7 kΩ'],null,'Vout'),'Unloaded voltage divider: Vout = 12 × 4.7 / 14.7 = 3.84 V.')}
${sheet('Formula sheet',[['Voltage divider','Vx = Vs · Rx / Rtotal','series resistors only, same current'],['Two-resistor form','Vout = Vs · R2 / (R1 + R2)','R2 is the resistor you measure across'],['Current divider','I1 = Is · R2 / (R1 + R2)','note: the OTHER resistor on top'],['General current divider','Ix = Is · Gx / Gtotal','G = 1/R']])}
<h3>The loading effect</h3>
<p>A divider's output only matches the formula when nothing draws current from it. Connecting a load RL puts it in parallel with R2, lowering the bottom resistance and pulling Vout down. Keep RL at least ten times larger than R2 if you need the output to hold steady.</p>
<div class="callout"><strong>Exam tip</strong>Before using a divider formula, confirm the resistors really carry the same current (voltage divider) or share the same voltage (current divider).</div>`,
kirchhoff:()=>`<p class="lede">Kirchhoff's two laws are bookkeeping rules: charge is conserved at nodes, energy is conserved around loops.</p>
<div class="figrow">${fig(figKCL([{n:'I1',v:'12 mA',dir:'in'},{n:'I3',v:'15 mA',dir:'out'},{n:'I2',v:'8 mA',dir:'in'},{n:'I4',v:'5 mA',dir:'out'}]),'KCL: 12 + 8 in = 15 + 5 out.')}${fig(figSeries3(['Vs','12 V'],[['V1','3 V'],['V2','4 V'],['V3','5 V']]),'KVL: 12 V rise = 3 + 4 + 5 V of drops.')}</div>
${sheet('The two laws',[['KCL (nodes)','Σ I_in = Σ I_out','equivalently Σ I = 0 at any node'],['KVL (loops)','Σ V around a loop = 0','rises count +, drops count − (or vice versa)']])}
<h3>A reliable procedure</h3>
<ul><li>Label every node and pick a reference (ground).</li><li>Assign a current direction to each branch. If you guess wrong, the answer simply comes out negative.</li><li>Write KCL at each node except the reference, and KVL around independent loops.</li><li>Substitute V = IR for each resistor and solve the equations.</li></ul>
<div class="callout"><strong>Watch the source polarity</strong>Walking around a loop, entering a source at its − terminal and leaving at + is a rise. Two sources pointing "against" each other subtract.</div>`,
thevenin:()=>`<p class="lede">Any linear two-terminal network, however complicated, behaves at its terminals like one voltage source in series with one resistor.</p>
<div class="figrow">${fig(figThev(['Vs','12 V'],['R1','6 kΩ'],['R2','3 kΩ']),'Original network')}<div class="equiv" aria-hidden="true">≡</div>${fig(figThevEq(['Vth','4 V'],['Rth','2 kΩ']),'Thévenin equivalent')}</div>
${sheet('Formula sheet',[['Thévenin voltage','Vth = V_open-circuit','measure a–b with nothing attached'],['Thévenin resistance','Rth = R seen at a–b','sources turned off'],['Norton current','IN = Vth / Rth','short-circuit current at a–b'],['Max power transfer','RL = Rth,  Pmax = Vth² / 4Rth','efficiency at this point is 50%']])}
<h3>Step by step</h3>
<ul><li><strong>1. Remove the load</strong> and find the open-circuit voltage at a–b. That is Vth.</li><li><strong>2. Turn off independent sources:</strong> voltage sources become shorts, current sources become opens.</li><li><strong>3. Find the resistance</strong> looking into a–b. That is Rth.</li><li><strong>4. Reattach the load</strong> to the simple equivalent and solve.</li></ul>
<div class="callout"><strong>Worked example</strong>12 V, R1 = 6 kΩ, R2 = 3 kΩ. Vth = 12 × 3/9 = 4 V. Rth = 6‖3 = 2 kΩ. A 2 kΩ load gets 1 mA and 2 mW, which is the maximum possible.</div>`,
transient:()=>`<p class="lede">Capacitors store energy in an electric field and resist sudden changes in voltage. Inductors store it in a magnetic field and resist sudden changes in current.</p>
${sheet('Formula sheet',[['Capacitor law','i = C · dv/dt','farads (F); v cannot jump'],['Inductor law','v = L · di/dt','henries (H); i cannot jump'],['Stored energy','W = ½CV²   W = ½LI²','joules (J)'],['C in parallel / series','C1 + C2   /   C1C2/(C1+C2)','the opposite of resistors'],['Time constant','τ = RC   τ = L/R','seconds'],['First-order response','x(t) = x∞ + (x0 − x∞)e^(−t/τ)','works for every RC and RL step']])}
${fig(figCharge(),'Each time constant closes 63.2% of the remaining gap to the final value.')}
<div class="sheet"><table><caption>Progress after n time constants</caption><thead><tr><th>t</th><th>Charging (% of final)</th><th>Discharging (% remaining)</th></tr></thead><tbody>${[1,2,3,4,5].map(k=>`<tr><td class="eq">${k}τ</td><td class="eq">${(100*(1-Math.exp(-k))).toFixed(1)}%</td><td class="eq">${(100*Math.exp(-k)).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>
<h3>DC steady state</h3>
<p>Long after a switch moves, nothing is changing. Then dv/dt = 0 so a capacitor carries no current and acts as an <strong>open circuit</strong>, and di/dt = 0 so an inductor has no voltage and acts as a <strong>short circuit</strong>. Use this to find initial and final values before writing x(t).</p>`,
ac:()=>`<p class="lede">Mains power, audio and radio are all built from sinusoids. Learn to read one and to describe how C and L respond to frequency.</p>
${fig(figSine(),'One cycle of v(t) = Vp·sin(2πft).')}
${sheet('Formula sheet',[['Sinusoid','v(t) = Vp·sin(ωt + φ)','φ is the phase angle'],['Angular frequency','ω = 2πf','rad/s'],['Period','T = 1/f','seconds'],['RMS (sine only)','Vrms = Vp/√2 ≈ 0.707·Vp','the DC-equivalent heating value'],['Peak-to-peak','Vpp = 2·Vp',''],['Inductive reactance','XL = 2πfL','grows with frequency'],['Capacitive reactance','XC = 1/(2πfC)','shrinks with frequency'],['Impedance','Z = R + jX','Ω; |Z| = √(R² + X²)']])}
<h3>Phase: ELI the ICE man</h3>
<p>In an inductor (L), voltage E leads current I by 90°. In a capacitor (C), current I leads voltage E by 90°. In a resistor they are in phase.</p>
<div class="sheet"><table><caption>Reactance of 1 µF and 10 mH at different frequencies</caption><thead><tr><th>f</th><th>XC (1 µF)</th><th>XL (10 mH)</th></tr></thead><tbody>${[50,1e3,1e4,1e5].map(f=>`<tr><td class="eq">${eng(f,'Hz')}</td><td class="eq">${eng(1/(2*Math.PI*f*1e-6),'Ω')}</td><td class="eq">${eng(2*Math.PI*f*.01,'Ω')}</td></tr>`).join('')}</tbody></table></div>`,
color:()=>`<p class="lede">Through-hole resistors print their value as coloured bands. Read from the end with the bands bunched together; the tolerance band sits apart.</p>
${fig(figResistor([COL[4],COL[7],COL[2],GOLD]),'Yellow 4, violet 7, red ×100, gold ±5% → 4.7 kΩ ±5%.')}
<div class="sheet"><table><caption>4-band colour code</caption><thead><tr><th>Colour</th><th>Digit</th><th>Multiplier</th><th>Tolerance</th></tr></thead><tbody>
${COL.map((c,i)=>`<tr><td>${sw(c)}</td><td class="eq">${i}</td><td class="eq">×${eng(10**i,'')}</td><td class="u">${i===1?'±1%':i===2?'±2%':''}</td></tr>`).join('')}
<tr><td>${sw(GOLD)}</td><td class="eq">–</td><td class="eq">×0.1</td><td class="u">±5%</td></tr><tr><td>${sw(SILVER)}</td><td class="eq">–</td><td class="eq">×0.01</td><td class="u">±10%</td></tr></tbody></table></div>
<h3>Remembering the order</h3>
<p>Black, brown, red, orange, yellow, green, blue, violet, grey, white run 0 to 9. A classroom mnemonic: "Big Boys Race Our Young Girls But Violet Generally Wins." The multiplier band is the number of zeros to add.</p>
<h3>Preferred values</h3>
<p>Resistors are only sold in preferred values. The E12 series (±10%) uses 1.0, 1.2, 1.5, 1.8, 2.2, 2.7, 3.3, 3.9, 4.7, 5.6, 6.8, 8.2 in every decade, so 4.7 kΩ exists but 5 kΩ does not.</p>`,
digital:()=>`<p class="lede">Digital circuits represent everything with two voltage levels, 0 and 1. Fluency with binary, hex and two's complement pays off in every later logic and programming course.</p>
<h3>Place value in binary</h3>
<div class="bits" aria-label="10110110 binary equals 182">${'10110110'.split('').map((b,i)=>`<div class="${b==='1'?'on':''}"><b>${b}</b><small>${2**(7-i)}</small></div>`).join('')}</div>
<p>1011 0110₂ = 128 + 32 + 16 + 4 + 2 = <strong>182</strong>. Group bits in fours to get hex: 1011 = B, 0110 = 6, so 182 = 0xB6.</p>
${sheet('Formula sheet',[['n-bit unsigned range','0 to 2ⁿ − 1','8 bits: 0–255'],['n-bit two\'s complement','−2ⁿ⁻¹ to 2ⁿ⁻¹ − 1','8 bits: −128 to +127'],['Negate (two\'s comp.)','invert all bits, add 1','−5 = 1111 1011'],['Binary → hex','group 4 bits from the right','1011 0110 = 0xB6'],['Decimal → binary','divide by 2, read remainders upward','13 → 1101']])}
<div class="sheet"><table><caption>The first sixteen values</caption><thead><tr><th>Decimal</th><th>Binary</th><th>Hex</th><th>Decimal</th><th>Binary</th><th>Hex</th></tr></thead><tbody>
${[0,1,2,3,4,5,6,7].map(n=>`<tr><td class="eq">${n}</td><td class="eq">${n.toString(2).padStart(4,'0')}</td><td class="eq">${n.toString(16).toUpperCase()}</td><td class="eq">${n+8}</td><td class="eq">${(n+8).toString(2)}</td><td class="eq">${(n+8).toString(16).toUpperCase()}</td></tr>`).join('')}</tbody></table></div>
<div class="callout"><strong>Two's complement in one line</strong>The leftmost bit is worth −2ⁿ⁻¹ instead of +2ⁿ⁻¹. So 1111 1011 = −128 + 64 + 32 + 16 + 8 + 2 + 1 = −5.</div>`};

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(code){
  const re=/(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(def|return|if|elif|else|for|while|in|and|or|not|True|False|None|break|continue|import|lambda)\b|\b(print|range|len|sum|int|float|str|type|list|append|upper|max|min|abs)\b|\b(0b[01]+|\d+(?:\.\d+)?)\b/g;
  let out='',i=0,m;
  while((m=re.exec(code))){out+=esc(code.slice(i,m.index));const c=m[1]?'c':m[2]?'s':m[3]?'k':m[4]?'b':'n';out+=`<span class="${c}">${esc(m[0])}</span>`;i=re.lastIndex}
  return out+esc(code.slice(i));
}
const mn=x=>String(x).replace(/-/g,'−');
const fx=x=>{if(!isFinite(x))return '—';const a=Math.abs(x);if(a!==0&&(a>=1e6||a<1e-3))return x.toExponential(3).replace(/e([+-]\d+)/,(m,e)=>' × 10<sup>'+mn(+e)+'</sup>');return mn(+x.toPrecision(5))};
function poly(t,v='x'){let s='';t.filter(([c])=>c!==0).forEach(([c,p],i)=>{const a=Math.abs(c),body=p===0?String(a):(a===1?'':a)+v+(p>1?`<sup>${p}</sup>`:'');s+=i===0?(c<0?'−':'')+body:(c<0?' − ':' + ')+body});return s||'0'}
const pn=x=>x<0?`(${mn(x)})`:String(x);
const integ=(a,b)=>`<span class="int">∫<span class="lim"><sup>${b}</sup><sub>${a}</sub></span></span>`;
const ov=s=>`<span class="ov">${s}</span>`;
function arrowP(pts,cls){const a=pts[pts.length-2],b=pts[pts.length-1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,bx=b[0]-ux*9,by=b[1]-uy*9;
  return `<polyline class="${cls||'w'}" points="${pts.slice(0,-1).concat([[bx,by]]).map(p=>p.map(v=>+v.toFixed(1)).join(',')).join(' ')}"/><path class="${cls==='arrl'?'arr':'arrh'}" d="M${b[0].toFixed(1)} ${b[1].toFixed(1)}L${(bx-uy*5).toFixed(1)} ${(by+ux*5).toFixed(1)}L${(bx+uy*5).toFixed(1)} ${(by-ux*5).toFixed(1)}z"/>`}
const GRAV=9.81,KC=8.99e9,EPS0=8.854e-12;
const pyList=a=>`[${a.join(', ')}]`;
const pyFloat=x=>Number.isInteger(x)?x.toFixed(1):String(x);
const pyMod=(a,b)=>((a%b)+b)%b;
const code=(...l)=>l.join('\n');

function gate(type,x,y){

const pre=c=>`<pre class="code">${hl(c)}</pre>`;
Object.assign(NOTES,{
deriv:()=>`<p class="lede">A derivative is an instantaneous rate of change: the slope of a curve at a single point. Circuits are full of them: i = dq/dt, i = C·dv/dt, v = L·di/dt.</p>
${fig(figTangent(),'As the second point slides toward x = 2, the secant slope approaches the tangent slope f′(2).')}
${sheet('Formula sheet',[['Definition','f′(x) = lim (f(x+h) − f(x)) / h','as h → 0'],['Power rule','d/dx xⁿ = n·xⁿ⁻¹','any real n'],['Sum & constant','(af + bg)′ = af′ + bg′','differentiate term by term'],['Product rule','(fg)′ = f′g + fg′',''],['Quotient rule','(f/g)′ = (f′g − fg′) / g²',''],['Chain rule','d/dx f(g(x)) = f′(g(x))·g′(x)','"outside, then inside"'],['Trig','(sin kx)′ = k cos kx,  (cos kx)′ = −k sin kx','x in radians'],['Exponential & log','(e^(kx))′ = k·e^(kx),  (ln x)′ = 1/x','']])}
<div class="callout"><strong>Worked example</strong>A 100 µF capacitor has v(t) = 10 sin(377t) V across it. i = C·dv/dt = 100×10⁻⁶ × 10 × 377 cos(377t) = 0.377 cos(377t) A. The current peaks when the voltage crosses zero, which is why capacitor current leads voltage by 90°.</div>
<h3>Common mistakes</h3>
<ul><li>Forgetting the inner derivative in the chain rule: (3x + 1)⁴ differentiates to 4(3x + 1)³ × 3.</li><li>Using degrees in trig derivatives. The rules only hold for radians.</li><li>Treating the product rule like the sum rule: (fg)′ is not f′g′.</li></ul>`,
integ:()=>`<p class="lede">Integration accumulates a quantity. In EE you integrate current to get charge, power to get energy, and capacitor current to get voltage.</p>
${fig(figRiemann(),'Thin rectangles approximate the area; as Δx → 0 the sum becomes the definite integral.')}
${sheet('Formula sheet',[['Power rule','∫ xⁿ dx = xⁿ⁺¹/(n+1) + C','n ≠ −1'],['Reciprocal','∫ (1/x) dx = ln|x| + C',''],['Exponential','∫ e^(kx) dx = e^(kx)/k + C',''],['Trig','∫ sin kx dx = −cos(kx)/k,  ∫ cos kx dx = sin(kx)/k',''],['Fundamental theorem','∫ₐᵇ f(x) dx = F(b) − F(a)','F is any antiderivative'],['Average value','f_avg = (1/(b − a)) ∫ₐᵇ f dx',''],['RMS value','V_rms = √( (1/T) ∫₀ᵀ v² dt )','gives Vp/√2 for a sine'],['By parts','∫ u dv = uv − ∫ v du','for products like t·e^(−t)']])}
<h3>Where integrals show up in circuits</h3>
<ul><li>Charge: <i class="v">q = ∫ i dt</i></li><li>Energy: <i class="v">W = ∫ p dt</i></li><li>Capacitor voltage: <i class="v">v = (1/C) ∫ i dt</i></li><li>Inductor current: <i class="v">i = (1/L) ∫ v dt</i></li></ul>
<div class="callout"><strong>Worked example</strong>i(t) = 20e^(−t/0.005) mA. Total charge as t → ∞ is ∫₀^∞ 20e^(−t/τ) dt = 20 mA × 5 ms = 100 µC. The area under an exponential decay is simply its starting value times τ.</div>`,
limits:()=>`<p class="lede">Limits describe what a function approaches. Setting a derivative to zero finds where a function peaks, which is how you prove results like maximum power transfer.</p>
${fig(figOpt(),'At a smooth maximum the tangent is horizontal, so f′(x) = 0.')}
${sheet('Formula sheet',[['Standard limit','lim sin(x)/x = 1','x → 0'],['Rational at ∞','ratio of leading coefficients','if degrees are equal; 0 if the bottom degree is higher'],['L\'Hôpital','lim f/g = lim f′/g′','only for 0/0 or ∞/∞'],['Critical point','f′(c) = 0 or undefined','candidates for max/min'],['Second derivative test','f″(c) < 0 → max,  f″(c) > 0 → min','test fails if f″(c) = 0']])}
<h3>Optimization in four steps</h3>
<ul><li><strong>1.</strong> Write the quantity to maximise or minimise as a function of one variable.</li><li><strong>2.</strong> Differentiate and set the derivative to zero.</li><li><strong>3.</strong> Solve for the variable and check it is a max or min (f″, or the sign of f′ either side).</li><li><strong>4.</strong> Check the endpoints of the allowed range too.</li></ul>
<div class="callout"><strong>Circuits connection</strong>Load power is P(R) = V²R/(R + r)². Setting dP/dR = 0 gives (R + r) − 2R = 0, so R = r. That is the maximum power transfer theorem, proved with one derivative.</div>`,
kinem:()=>`<p class="lede">Kinematics describes motion without asking what causes it. With constant acceleration, four equations cover almost every problem.</p>
${fig(figVT(),'Slope of v–t is acceleration; the shaded area is displacement.')}
${sheet('Constant-acceleration equations (SUVAT)',[['Velocity','v = u + at','u is initial velocity'],['Displacement','s = ut + ½at²',''],['No time','v² = u² + 2as','use when t is unknown'],['Average velocity','s = ½(u + v)t',''],['Free fall','a = g = 9.81 m/s² downward','choose a sign convention and keep it']])}
${fig(figProjectile(),'A 20 m/s launch at 45°: horizontal speed is constant, vertical motion is free fall.')}
${sheet('Projectiles (level ground, no air resistance)',[['Horizontal','x = (u cos θ)·t','no horizontal acceleration'],['Vertical','y = (u sin θ)·t − ½gt²',''],['Time of flight','T = 2u sin θ / g',''],['Range','R = u² sin 2θ / g','maximum at 45°'],['Maximum height','H = u² sin²θ / 2g','']])}
<div class="callout"><strong>The key idea</strong>Split motion into horizontal and vertical parts. They share only the time t, so solve one direction for t, then use it in the other.</div>`,
forces:()=>`<p class="lede">Newton's laws connect forces to motion. Energy methods often give the same answers faster, without needing time.</p>
<ul><li><strong>First law:</strong> an object keeps its velocity unless a net force acts.</li><li><strong>Second law:</strong> F<sub>net</sub> = ma.</li><li><strong>Third law:</strong> forces come in equal and opposite pairs acting on different objects.</li></ul>
${fig(figIncline(),'Weight mg splits into mg sin θ along the slope and mg cos θ into it; N balances the second.')}

<h3>Minterms and sum of products</h3>
<p>Each row of a truth table is a minterm, numbered by reading ABC as binary. A function written as Σm(…) lists the rows where it is 1. ORing those rows gives a correct but long sum-of-products; a Karnaugh map shortens it.</p>
${fig(figKmap([0,2,4,5,6],[[-.25,0,1.3,2],[2.95,0,1.3,2],[0,1,2,1]]),'Σm(0,2,4,5,6): the wrap-around quad gives C̄ and the pair gives A·B̄, so Y = C̄ + A·B̄.')}
<h3>K-map grouping rules</h3>
<ul><li>Groups must be rectangles of 1, 2, 4 or 8 cells.</li><li>Make every group as large as possible; overlapping is allowed.</li><li>Edges wrap around: column 00 is adjacent to column 10.</li><li>Use as few groups as possible to cover every 1. In each group, variables that change are eliminated.</li></ul>`,
