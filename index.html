Object.assign(NOTES,{
kinem:()=>`<p class="lede">Kinematics describes how things move (position, velocity, acceleration) without asking why. It is the language every later mechanics topic is written in, and the same mathematics describes electrons in a cathode-ray tube or charges in a field.</p>
<h3>Position, displacement and distance</h3>
<p>Position x is measured from a chosen origin along a chosen positive direction. Displacement Δx = x₂ − x₁ is a vector: it has a sign. Distance is the total path length and is never negative. Walk 5 m east then 5 m west: distance 10 m, displacement 0.</p>
<h3>Velocity and speed</h3>
<p>Average velocity is v̄ = Δx/Δt. Instantaneous velocity is the limit as Δt → 0, which is the derivative <i class="v">v = dx/dt</i>: the slope of the position–time graph. Speed is the magnitude of velocity.</p>
<h3>Acceleration</h3>
<p>Acceleration is the rate of change of velocity, <i class="v">a = dv/dt = d²x/dt²</i>. An object can have zero velocity and non-zero acceleration (a ball at the top of its flight), or be slowing down while its acceleration is positive (moving in the negative direction).</p>
${fig(figMotionGraphs(),'Each graph is the slope of the one to its left. Going the other way, each is the area under the one to its right.')}
${ul(['Slope of x–t = velocity; slope of v–t = acceleration.','Area under v–t = displacement; area under a–t = change in velocity.','A straight x–t line means constant velocity; a curved one means acceleration.','Where x–t has a peak or trough, the velocity is momentarily zero.'])}
<h3>Constant acceleration</h3>
${sheet('The SUVAT equations (valid only when a is constant)',[['No s','v = u + at','u = initial velocity'],['No v','s = ut + ½at²',''],['No t','v² = u² + 2as',''],['No a','s = ½(u + v)t',''],['No u','s = vt − ½at²','rarely needed']])}
${dv('Derivation: integrate a constant acceleration',`<p>Start from a = dv/dt = constant. Integrating once: v = u + at, where the constant of integration u is the velocity at t = 0. Since v = dx/dt, integrate again: s = x − x₀ = ut + ½at². Eliminating t between these two gives v² = u² + 2as. Every SUVAT equation comes from these two integrations.</p>`)}
<p><strong>Strategy:</strong> list the five quantities s, u, v, a, t; mark the three you know and the one you want; choose the equation that leaves out the fifth.</p>
<h3>Free fall</h3>
<p>Near Earth's surface, ignoring air resistance, every object accelerates downward at g = 9.81 m/s², whatever its mass. Pick a sign convention (up positive gives a = −9.81 m/s²) and keep it for every quantity in the problem.</p>
${wx('A stone is thrown up at 15 m/s from a 20 m cliff. How long until it hits the ground below?',['Up positive: u = +15 m/s, a = −9.81 m/s², s = −20 m (ends below the start).','s = ut + ½at² → −20 = 15t − 4.905t², so 4.905t² − 15t − 20 = 0.','Quadratic formula: t = (15 + √(225 + 392.4)) / 9.81 = 4.06 s (reject the negative root).'])}
<h3>Projectile motion</h3>
<p>Once launched, a projectile has only gravity acting on it (no air resistance), so its horizontal velocity is constant and its vertical motion is free fall. The two directions share only the time t.</p>
${fig(figProjectile(),'Parabolic path for a 20 m/s launch at 45°.')}
${sheet('Projectile on level ground (launch speed u at angle θ)',[['Horizontal','x = u cos θ · t','constant velocity'],['Vertical','y = u sin θ · t − ½gt²','free fall'],['Time of flight','T = 2u sin θ / g',''],['Range','R = u² sin 2θ / g','maximum at θ = 45°'],['Max height','H = u² sin²θ / 2g',''],['Path','y = x tan θ − gx² / (2u² cos²θ)','a parabola']])}
${dv('Derivation: range on level ground',`<p>The projectile lands when y = 0: t(u sin θ − ½gt) = 0, so T = 2u sin θ / g. The horizontal distance in that time is R = u cos θ · T = 2u² sin θ cos θ / g = u² sin 2θ / g. Because sin 2θ = sin(180° − 2θ), angles θ and 90° − θ give the same range.</p>`)}
<h3>Relative motion</h3>
<p>Velocities measured in different frames add as vectors: <i class="v">v_A,ground = v_A,B + v_B,ground</i>. A boat crossing a river, or a plane in a crosswind, is a vector-addition problem. Crossing time depends only on the velocity component straight across.</p>
<h3>When acceleration is not constant</h3>
<p>Use calculus directly: v = dx/dt and a = dv/dt, or go backwards with v = ∫a dt and x = ∫v dt. For x(t) = 2t³, v = 6t² and a = 12t, so the SUVAT equations would give wrong answers.</p>
<h3>Common mistakes</h3>
${ul(['Mixing sign conventions halfway through, e.g. taking g as +9.81 while up is positive.','Using SUVAT when the acceleration changes.','Saying velocity is zero at the top of a projectile path: only the vertical component is zero.','Forgetting that the horizontal component of velocity stays constant.'])}
${co('EE connection','An electron entering the deflection plates of an oscilloscope has constant horizontal speed and a constant sideways acceleration eE/m. Its path is a parabola, exactly like a projectile, and the same equations give the spot position on the screen.')}`,

newton:()=>`<p class="lede">Newton's three laws connect forces to motion. Almost every mechanics problem is solved the same way: identify the forces, draw a free-body diagram, and apply ΣF = ma along sensible axes.</p>
<h3>The three laws</h3>
${ul(['<strong>First law (inertia):</strong> an object stays at rest or moves at constant velocity unless a net external force acts. This defines an inertial frame of reference: one that is not itself accelerating.','<strong>Second law:</strong> <i class="v">ΣF = ma</i>. The net force, a vector sum, causes acceleration in the same direction. Mass measures resistance to acceleration (inertia). 1 N = 1 kg·m/s².','<strong>Third law:</strong> if A pushes on B, then B pushes on A with an equal and opposite force. The pair acts on <em>different</em> objects, so they never cancel on a single free-body diagram.'])}
<h3>Mass and weight</h3>
<p>Mass (kg) is a property of the object. Weight is the gravitational force on it, W = mg, measured in newtons. A 70 kg person weighs 687 N on Earth and about 114 N on the Moon; their mass is 70 kg everywhere.</p>
${tbl('Forces you will meet',['Force','Formula','Direction / notes'],[['Weight','W = mg','straight down'],['Normal force','N (from equilibrium or ΣF = ma)','perpendicular to the surface, pushes only'],['Tension','T','along the rope, pulls only; same throughout a light rope over a frictionless pulley'],['Static friction','fₛ ≤ μₛN','opposes impending motion; takes whatever value is needed up to the maximum'],['Kinetic friction','fₖ = μₖN','opposes sliding; usually μₖ &lt; μₛ'],['Spring','F = −kx','towards natural length (Hooke\'s law)'],['Drag','F = ½ρC_dAv²','opposes motion; grows with v²']])}
<h3>Free-body diagrams</h3>
${ul(['Isolate one object. Draw it as a box or dot.','Draw every force acting <em>on</em> it, starting at the object, with a label. Forces it exerts on other things do not belong.','Choose axes, usually along and perpendicular to the acceleration (along an incline, not horizontal).','Resolve each force into components and write ΣFₓ = maₓ and ΣF_y = ma_y.'])}
${fig(figIncline(),'On an incline, tilt the axes: weight splits into mg sin θ down the slope and mg cos θ into the surface.')}
<h3>Inclined planes</h3>
<p>Perpendicular to the slope there is no acceleration, so N = mg cos θ. Along the slope, ΣF = mg sin θ − f. With kinetic friction f = μₖmg cos θ, which gives <i class="v">a = g(sin θ − μₖ cos θ)</i>. A block starts to slide when tan θ exceeds μₛ, which gives a simple way to measure friction coefficients.</p>
<h3>Connected bodies and pulleys</h3>
${fig(figAtwood(),'In an Atwood machine the heavier mass accelerates down and the lighter one up at the same rate.')}
${dv('Derivation: the Atwood machine',`<p>Write Newton's law for each mass, taking the direction each mass moves as positive. Heavy mass: m₁g − T = m₁a. Light mass: T − m₂g = m₂a. Adding eliminates T: (m₁ − m₂)g = (m₁ + m₂)a, so a = (m₁ − m₂)g / (m₁ + m₂). Substituting back: T = 2m₁m₂g / (m₁ + m₂). Note T lies between m₂g and m₁g, as it must.</p>`)}
<p>For blocks joined by ropes on a surface, first treat the whole chain as one object to find a = F/Σm, then isolate one block to find the tension.</p>
<h3>Apparent weight</h3>
<p>Scales measure the normal force, not your weight. In a lift accelerating upward at a, N = m(g + a); accelerating downward, N = m(g − a). In free fall (a = g) the scale reads zero, which is why astronauts in orbit feel weightless even though gravity still acts on them.</p>
<h3>Equilibrium and drag</h3>
<p>When the acceleration is zero (at rest or at constant velocity) the forces balance: ΣF = 0 in every direction. A falling object speeds up until drag equals weight, then falls at terminal velocity v_t = √(2mg / ρC_dA).</p>
${wx('A 5 kg box is pulled across a floor (μₖ = 0.3) by a rope at 30° above the horizontal with 40 N of tension. Find the acceleration.',['Vertical: N + 40 sin 30° − 5 × 9.81 = 0, so N = 49.05 − 20 = 29.05 N. The rope lifts some of the weight.','Friction: f = 0.3 × 29.05 = 8.72 N.','Horizontal: 40 cos 30° − 8.72 = 5a → a = (34.64 − 8.72)/5 = 5.18 m/s².'])}
<h3>Common mistakes</h3>
${ul(['Assuming N = mg every time. It is not true on slopes, in lifts, or when other forces have vertical components.','Using "ma" as if it were a force on the diagram.','Putting both forces of a third-law pair on the same diagram.','Using μₛN as the static friction force when the object is not on the verge of slipping.'])}
${co('EE connection','A charge in an electric field obeys the same law: F = qE = ma. Electron guns, particle accelerators and electrostatic actuators in MEMS sensors are all F = ma problems.')}`,

forces:()=>`<p class="lede">Energy methods solve many mechanics problems without needing time or detailed forces. Energy is also the bridge to electricity: a volt is a joule per coulomb, and your power bill is measured in kilowatt-hours.</p>
<h3>Work</h3>
<p>A constant force F moving its point of application through displacement d does work <i class="v">W = F·d = Fd cos θ</i>, a scalar measured in joules. Only the component of force along the motion does work. A force perpendicular to the motion (the normal force on a level floor, the tension in a circular orbit) does no work.</p>
<p>For a varying force, add up small pieces: <i class="v">W = ∫F dx</i>, the area under the force–position graph. For a spring F = kx, so the work to stretch it by x is ½kx².</p>
<h3>Kinetic energy and the work–energy theorem</h3>
<p>Kinetic energy is KE = ½mv². The work–energy theorem says the <em>net</em> work done on an object equals its change in kinetic energy: <i class="v">W_net = ΔKE</i>.</p>
${dv('Derivation: work–energy theorem',`<p>W_net = ∫F dx = ∫ma dx = ∫m (dv/dt) dx = ∫m v dv (since dx/dt = v) = ½mv₂² − ½mv₁². So the work done by the net force goes entirely into kinetic energy.</p>`)}
<h3>Potential energy and conservative forces</h3>
<p>A force is conservative if the work it does depends only on the start and end points, not the path. Gravity, springs and electrostatic forces are conservative; friction and drag are not. For a conservative force we define potential energy U so that W = −ΔU, and equivalently <i class="v">F = −dU/dx</i>: the force points downhill on the energy graph.</p>
${sheet('Energy formulas',[['Kinetic','KE = ½mv²','joules'],['Gravitational (near surface)','U = mgh','h measured from any chosen zero'],['Gravitational (general)','U = −GMm / r','zero at infinity'],['Elastic (spring)','U = ½kx²','x from natural length'],['Electric','U = qV','same idea, per unit charge'],['Power','P = dW/dt = F·v','watts = J/s'],['Efficiency','η = useful output / input','always below 100%']])}
<h3>Conservation of energy</h3>
<p>If only conservative forces do work, mechanical energy is conserved: <i class="v">KE₁ + U₁ = KE₂ + U₂</i>. With friction, include the energy turned into heat: KE₁ + U₁ = KE₂ + U₂ + f·d. Total energy, counting heat, sound and every other form, is always conserved.</p>
${wx('A 2 kg block slides from rest down a frictionless ramp 3 m high, then across a rough floor (μₖ = 0.25). How far does it slide on the floor?',['At the bottom of the ramp: mgh = ½mv², so v = √(2 × 9.81 × 3) = 7.67 m/s.','On the floor friction removes it all: μₖmg·d = ½mv² = mgh.','d = h/μₖ = 3/0.25 = 12 m. The mass cancels.'])}
<h3>Energy diagrams</h3>
<p>Plot U(x) and draw a horizontal line at the total energy E. The object can only be where E ≥ U, and KE = E − U. Points where the line meets the curve are turning points. A minimum of U is a stable equilibrium (small pushes give oscillation), and a maximum is unstable.</p>
<h3>Power</h3>
<p>Power is the rate of energy transfer: P = W/t, or for a force moving at velocity v, P = Fv. 1 kWh = 1000 W × 3600 s = 3.6 MJ. A 2 kW kettle running for 3 minutes uses 0.1 kWh.</p>
<h3>Common mistakes</h3>
${ul(['Using Fd without the cos θ when force and motion are not parallel.','Adding a "work done by gravity" term and also including mgh, which counts gravity twice.','Forgetting that the zero of potential energy is arbitrary; only differences matter.','Mixing kW and kWh. One is a rate, the other an amount.'])}
${co('EE connection','Voltage is potential energy per unit charge, so moving a charge q through a potential difference V transfers energy qV, exactly like lifting a mass through height h transfers mgh. Electrical power P = VI is the same "rate of doing work" idea.')}`,

momentum:()=>`<p class="lede">Momentum is conserved in every isolated system, which makes it the go-to tool for collisions, explosions and recoil, where the forces are too brief and complicated to follow in detail.</p>
<h3>Momentum and Newton's second law</h3>
<p>Linear momentum is <i class="v">p = mv</i>, a vector (kg·m/s). Newton's second law in its original form is <i class="v">F = dp/dt</i>; for constant mass this reduces to F = ma, but the momentum form also works for rockets and other systems that gain or lose mass.</p>
<h3>Impulse</h3>
<p>Impulse is the time-integral of force: <i class="v">J = ∫F dt = Δp</i>. It equals the area under a force–time graph. For a given change in momentum, a longer contact time means a smaller average force, which is the principle behind airbags, crumple zones, bending your knees when you land, and padded packaging for electronics.</p>
<h3>Conservation of momentum</h3>
<p>If the net external force on a system is zero, its total momentum is constant. Internal forces come in third-law pairs that cancel in the sum. In a collision the impact forces are so large and brief that external forces such as friction can usually be ignored during the collision.</p>
${fig(figCollision(),'In every collision, total momentum before = total momentum after.')}
${tbl('Types of collision',['Type','Momentum','Kinetic energy'],[['Elastic','conserved','conserved (billiard balls, atoms)'],['Inelastic','conserved','partly lost to heat, sound, deformation'],['Perfectly inelastic','conserved','maximum loss; objects stick together'],['Explosion','conserved (often zero)','increases, from stored chemical energy']])}
${dv('Derivation: 1-D elastic collision with m₂ at rest',`<p>Momentum: m₁v = m₁v₁′ + m₂v₂′. Energy: ½m₁v² = ½m₁v₁′² + ½m₂v₂′². Rearranging both as m₁(v − v₁′) = m₂v₂′ and m₁(v² − v₁′²) = m₂v₂′², then dividing, gives v + v₁′ = v₂′: the relative speed reverses. Solving the pair: v₁′ = (m₁ − m₂)v/(m₁ + m₂), v₂′ = 2m₁v/(m₁ + m₂). Equal masses swap velocities; a light ball bounces off a heavy one; a heavy ball barely slows when hitting a light one.</p>`)}
<h3>Two dimensions</h3>
<p>Momentum is a vector, so conserve each component separately: Σpₓ before = Σpₓ after, and Σp_y before = Σp_y after. Glancing collisions of pucks and car crashes at junctions are solved this way.</p>
<h3>Centre of mass</h3>
<p>x_cm = Σmᵢxᵢ / Σmᵢ. The centre of mass moves as if all the mass were concentrated there and all external forces acted on it: M·a_cm = ΣF_ext. After an explosion in mid-air, the fragments' centre of mass continues along the original parabola.</p>
<h3>Recoil and rockets</h3>
<p>A gun and bullet start with zero momentum, so afterwards MV = mv in opposite directions. A rocket pushes exhaust backwards at relative speed u; the thrust is u·(dm/dt), and the speed gained is Δv = u ln(m₀/m_f), the rocket equation.</p>
${wx('A 1200 kg car at 20 m/s rear-ends a stationary 1800 kg van and they lock together. Find their speed and the energy lost.',['Momentum: 1200 × 20 = 3000 v′ → v′ = 8 m/s.','KE before = ½ × 1200 × 20² = 240 kJ. KE after = ½ × 3000 × 8² = 96 kJ.','Energy lost = 144 kJ (60%), which goes into deforming the vehicles.'])}
<h3>Common mistakes</h3>
${ul(['Forgetting that momentum is a vector: a ball bouncing back has Δp = m(v₁ + v₂), not m(v₂ − v₁).','Assuming kinetic energy is conserved in every collision.','Conserving momentum when a large external force acts during the event.'])}`,

circular:()=>`<p class="lede">An object moving in a circle at constant speed is still accelerating, because its direction keeps changing. Add Newton's law of gravitation and the same ideas explain orbits, satellites and why GPS works.</p>
<h3>Angular quantities</h3>
${sheet('Describing circular motion',[['Angle','θ = s / r','radians: arc length over radius'],['Angular velocity','ω = dθ/dt = 2πf = 2π/T','rad/s; 1 rpm = 2π/60 rad/s'],['Speed','v = ωr','tangent to the circle'],['Centripetal acceleration','a = v²/r = ω²r','towards the centre'],['Centripetal force','F = mv²/r','the net inward force']])}
${fig(figCircular(),'Velocity is tangent to the path; acceleration points to the centre.')}
${dv('Derivation: a = v²/r',`<p>In time Δt the object turns through Δθ = vΔt/r. Its velocity vector, length v, rotates through the same angle, so the change in velocity has magnitude |Δv| ≈ vΔθ = v²Δt/r, pointing towards the centre. Dividing by Δt gives a = v²/r.</p>`)}
<h3>Centripetal force is a job, not a new force</h3>
<p>"Centripetal force" is whatever real force (or combination) points to the centre: friction for a car on a flat curve, tension for a ball on a string, gravity for a satellite, the normal force for a roller coaster loop, and the magnetic force for a charge in a magnetic field. Never add an extra "mv²/r" arrow to a free-body diagram; instead set the net inward force equal to mv²/r.</p>
${ul(['<strong>Flat curve:</strong> μₛmg ≥ mv²/r, so the maximum speed is √(μₛgr).','<strong>Banked curve:</strong> with no friction, tan θ = v²/(rg) gives the design speed.','<strong>Top of a vertical loop:</strong> N + mg = mv²/r; the minimum speed (N = 0) is √(gr).','<strong>Conical pendulum:</strong> tan θ = v²/(rg), the same geometry as the banked curve.'])}
<h3>Newton's law of gravitation</h3>
<p>Every pair of masses attracts with <i class="v">F = Gm₁m₂/r²</i>, where G = 6.674 × 10⁻¹¹ N·m²/kg² and r is measured between centres. For a spherical planet the field at the surface is g = GM/R², which gives 9.81 m/s² for Earth. With altitude it falls as g(h) = g₀ R²/(R + h)². The ISS at 400 km still has about 89% of surface gravity; its crew feel weightless because they are in free fall.</p>
<h3>Orbits</h3>
${sheet('Circular orbits of radius r around mass M',[['Orbital speed','v = √(GM/r)','independent of the satellite\'s mass'],['Period','T = 2π√(r³/GM)','Kepler\'s third law: T² ∝ r³'],['Total energy','E = −GMm / 2r','negative means bound'],['Escape speed','v_esc = √(2GM/R)','11.2 km/s from Earth\'s surface'],['Geostationary radius','r ≈ 42 164 km','T = 23 h 56 min, about 35 786 km altitude']])}
${dv('Derivation: orbital speed and escape velocity',`<p>For a circular orbit, gravity provides the centripetal force: GMm/r² = mv²/r, so v = √(GM/r). To escape, kinetic energy must at least cancel the (negative) potential energy: ½mv² − GMm/R = 0, giving v_esc = √(2GM/R) = √2 × the orbital speed at the surface.</p>`)}
<h3>Kepler's laws</h3>
${ul(['Planets move in ellipses with the Sun at one focus.','A line from the Sun to a planet sweeps equal areas in equal times (a consequence of conservation of angular momentum).','T² ∝ a³, where a is the semi-major axis.'])}
${wx('Find the altitude of a geostationary satellite.',['T = 86 164 s (one sidereal day). From T² = 4π²r³/GM: r³ = GMT²/4π².','r³ = 6.674×10⁻¹¹ × 5.972×10²⁴ × 86 164² / (4π²) = 7.50 × 10²² m³, so r = 4.22 × 10⁷ m.','Altitude = r − R = 42 164 − 6 371 = 35 793 km.'])}
${co('EE connection','Communications satellites sit in geostationary orbit so dishes can point at a fixed spot. GPS satellites orbit at about 20 200 km with a 12-hour period, and their clocks must be corrected for both orbital speed and weaker gravity.')}`,

rotation:()=>`<p class="lede">Rotation has its own version of every linear quantity: angle for position, torque for force, moment of inertia for mass. Learn the correspondence and rotational problems become familiar.</p>
${tbl('Linear ↔ rotational',['Linear','Rotational','Link'],[['x (m)','θ (rad)','s = rθ'],['v (m/s)','ω (rad/s)','v = rω'],['a (m/s²)','α (rad/s²)','a_t = rα'],['m (kg)','I (kg·m²)','I = Σmr²'],['F (N)','τ (N·m)','τ = rF sin θ'],['F = ma','τ = Iα',''],['p = mv','L = Iω',''],['KE = ½mv²','KE = ½Iω²',''],['P = Fv','P = τω','']],[0,1,2])}
<h3>Angular kinematics</h3>
<p>With constant angular acceleration the SUVAT equations carry over directly: ω = ω₀ + αt, θ = ω₀t + ½αt², ω² = ω₀² + 2αθ. Always work in radians; convert rpm with ω = rpm × 2π/60.</p>
<h3>Torque</h3>
${fig(figTorque(),'Only the perpendicular part of the force, or equivalently the perpendicular distance to its line of action, produces torque.')}
<p>Torque is the turning effect of a force: <i class="v">τ = r × F</i>, with magnitude rF sin θ = r⊥F. It is largest when the force is perpendicular to the lever and zero when the force points through the pivot. That is why door handles sit far from the hinges.</p>
<h3>Moment of inertia</h3>
<p>I = Σmᵢrᵢ² (or ∫r² dm) measures how hard an object is to spin up. It depends on how the mass is distributed around the axis, not just how much there is.</p>
${tbl('Moments of inertia',['Object','Axis','I'],[['Thin hoop / ring','central axis','MR²'],['Solid disc / cylinder','central axis','½MR²'],['Solid sphere','diameter','⅖MR²'],['Thin spherical shell','diameter','⅔MR²'],['Thin rod, length L','through centre','ML²/12'],['Thin rod, length L','through one end','ML²/3']])}
<p><strong>Parallel-axis theorem:</strong> I = I_cm + Md², where d is the distance from the centre-of-mass axis to the new parallel axis. The rod values above differ by exactly M(L/2)².</p>
<h3>Dynamics, energy and rolling</h3>
<p>Newton's second law for rotation is <i class="v">Στ = Iα</i>. A spinning object stores KE = ½Iω². A rolling object (no slipping, v = ωR) has both: KE = ½mv² + ½Iω². That is why a hoop rolls down a ramp more slowly than a solid ball: more of its energy goes into spinning.</p>
<h3>Angular momentum</h3>
<p>L = Iω for a rigid body (or r × p for a particle). With no external torque, L is conserved. A skater pulling in their arms reduces I, so ω increases. Gyroscopes resist changes in their spin axis for the same reason.</p>
<h3>Static equilibrium</h3>
<p>A rigid body at rest needs both ΣF = 0 and Στ = 0 about <em>any</em> point. Choose the pivot at an unknown force to remove it from the torque equation. This is how you find the loads on beams, ladders and shelf brackets.</p>
${wx('A uniform 4 m, 20 kg beam is held horizontal by a hinge at one end and a vertical cable at the other. Find the cable tension.',['Take torques about the hinge so the hinge force disappears.','The weight acts at the centre (2 m): 20 × 9.81 × 2 = 392.4 N·m clockwise.','The cable at 4 m balances it: T × 4 = 392.4, so T = 98.1 N (half the weight, by symmetry).'])}
${co('EE connection','Motor datasheets give torque and speed; mechanical power output is P = τω. A gearbox trades speed for torque at (ideally) constant power. Flywheel energy storage and the rotor inertia that affects a servo\'s response are both ½Iω² and τ = Iα problems.')}`,

shm:()=>`<p class="lede">Whenever a restoring force grows in proportion to displacement, the result is simple harmonic motion: a pure sinusoid. Springs, pendulums, quartz crystals and LC circuits all obey the same equation, which makes this one of the most useful ideas in engineering.</p>
<h3>The defining equation</h3>
<p>For a mass on a spring, F = −kx, so m d²x/dt² = −kx, or <i class="v">d²x/dt² = −ω²x</i> with ω = √(k/m). Any system that can be written in this form oscillates sinusoidally.</p>
<p>The general solution is <i class="v">x(t) = A cos(ωt + φ)</i>. The amplitude A and phase φ come from the starting conditions; the angular frequency ω is fixed by the system. Period T = 2π/ω and frequency f = 1/T do not depend on amplitude.</p>
${fig(figSHM(),'Velocity leads displacement by a quarter cycle; acceleration is exactly opposite to displacement.')}
${sheet('Simple harmonic motion',[['Displacement','x = A cos(ωt + φ)',''],['Velocity','v = −Aω sin(ωt + φ)','max Aω at x = 0'],['Acceleration','a = −ω²x','max Aω² at x = ±A'],['Speed at position x','v = ω√(A² − x²)','from energy'],['Energy','E = ½kA² = ½mv_max²','constant'],['Mass–spring','ω = √(k/m),  T = 2π√(m/k)',''],['Simple pendulum','ω = √(g/L),  T = 2π√(L/g)','small angles (&lt; 15°)'],['Physical pendulum','T = 2π√(I / mgd)','d = pivot to centre of mass']])}
${dv('Derivation: the simple pendulum',`<p>The restoring force along the arc is −mg sin θ. For small angles sin θ ≈ θ (in radians), and the arc length is s = Lθ, so m d²s/dt² = −(mg/L)s. This is SHM with ω² = g/L. The mass cancels, and so does the amplitude, provided it stays small. That is why pendulum clocks keep good time.</p>`)}
<h3>Energy in SHM</h3>
<p>Energy sloshes between kinetic and potential: all potential (½kA²) at the turning points, all kinetic (½mv_max²) at the centre. Total energy is proportional to amplitude squared.</p>
<h3>Damping</h3>
<p>Add a friction-like force −bv and the oscillation decays. <strong>Underdamped</strong> systems ring down with an exponential envelope e^(−bt/2m). <strong>Critically damped</strong> systems return to rest fastest without overshoot, which is the target for car suspension and meter needles. <strong>Overdamped</strong> systems creep back slowly.</p>
<h3>Driven oscillations and resonance</h3>
<p>Driving a system at frequency f gives a steady oscillation at f, whose amplitude peaks near the natural frequency. The sharpness of the peak is the quality factor Q ≈ f₀/Δf. Low damping gives high Q and a tall, narrow peak. Resonance is useful in radio tuning and quartz oscillators, and destructive in bridges and machinery.</p>
${tbl('Mechanical ↔ electrical analogy',['Mass–spring–damper','Series RLC circuit'],[['displacement x','charge q'],['velocity v','current i'],['mass m','inductance L'],['spring constant k','1/C'],['damping b','resistance R'],['ω₀ = √(k/m)','ω₀ = 1/√(LC)'],['½mv² (kinetic)','½Li² (magnetic)'],['½kx² (potential)','q²/2C (electric)']],[0,1])}
${wx('A 0.5 kg mass on a 200 N/m spring is pulled 10 cm and released. Find f, v_max and the speed at x = 6 cm.',['ω = √(200/0.5) = 20 rad/s, so f = 20/2π = 3.18 Hz.','v_max = Aω = 0.10 × 20 = 2.0 m/s.','At x = 0.06 m: v = 20 × √(0.10² − 0.06²) = 20 × 0.08 = 1.6 m/s.'])}
${co('EE connection','An LC tank is a mass on a spring made of electricity: energy swaps between the capacitor\'s electric field and the inductor\'s magnetic field at f = 1/(2π√LC). Add resistance and you get exactly the under-, critically and over-damped responses of a second-order circuit.')}`,

waves:()=>`<p class="lede">A wave carries energy from place to place without carrying matter. Sound, vibrations on strings, ripples, radio and light all share the same vocabulary and equations.</p>
<h3>Types and vocabulary</h3>
${ul(['<strong>Transverse:</strong> the medium moves perpendicular to the wave direction (strings, light).','<strong>Longitudinal:</strong> the medium moves along the wave direction, forming compressions and rarefactions (sound).','<strong>Wavelength λ:</strong> distance between repeating points. <strong>Period T:</strong> time for one cycle. <strong>Frequency f = 1/T</strong>.','<strong>Wave speed</strong> <i class="v">v = fλ</i>, fixed by the medium. Changing the source frequency changes λ, not v.'])}
${sheet('Wave equations',[['Travelling wave','y(x, t) = A sin(kx − ωt)','moves in +x'],['Wave number','k = 2π/λ','rad/m'],['Speed','v = fλ = ω/k',''],['String','v = √(T/μ)','T = tension, μ = mass per length'],['Sound in air','v ≈ 331 + 0.6·T(°C) m/s','343 m/s at 20 °C'],['Intensity','I = P / 4πr²','inverse-square from a point source'],['Sound level','β = 10 log₁₀(I / 10⁻¹² W/m²)','dB']])}
<h3>Superposition and interference</h3>
<p>When waves overlap, displacements add. Two waves in phase interfere <strong>constructively</strong> (path difference = mλ); half a wavelength out of phase they interfere <strong>destructively</strong> (path difference = (m + ½)λ). Noise-cancelling headphones use deliberate destructive interference. Two close frequencies produce <strong>beats</strong> at |f₁ − f₂|, used to tune instruments.</p>
<h3>Standing waves</h3>
${fig(figStanding(),'Only wavelengths that fit the boundary conditions survive: these are the harmonics.')}
${tbl('Allowed frequencies',['System','Condition','Frequencies'],[['String fixed at both ends','L = nλ/2','fₙ = nv/2L, n = 1, 2, 3…'],['Pipe open at both ends','L = nλ/2','fₙ = nv/2L, n = 1, 2, 3…'],['Pipe closed at one end','L = nλ/4, n odd','fₙ = nv/4L, n = 1, 3, 5…']])}
<p>A standing wave is two identical waves travelling in opposite directions. Nodes never move; antinodes swing with maximum amplitude, and adjacent nodes are λ/2 apart.</p>
<h3>Decibels</h3>
<p>The ear (and many instruments) respond to ratios, so levels are logarithmic. A 10× increase in intensity is +10 dB; doubling the power is +3 dB. EE uses the same scale: power gain in dB = 10 log₁₀(P₂/P₁), voltage gain = 20 log₁₀(V₂/V₁), because power goes as V².</p>
<h3>Doppler effect</h3>
<p>A moving source or observer changes the frequency heard: <i class="v">f′ = f (v + v_o)/(v − v_s)</i>, with speeds positive when moving toward each other. Radar speed guns and Doppler ultrasound measure this shift.</p>
<h3>Reflection, refraction and diffraction</h3>
${ul(['Waves reflect at a boundary; at a fixed end the reflection is inverted.','When speed changes across a boundary the wave bends (refracts) and λ changes, but f stays the same.','Waves spread round obstacles and through gaps comparable to λ. This is why you hear around corners and why long radio waves follow terrain.'])}
${wx('A guitar string 0.65 m long has μ = 1.2 g/m. What tension tunes its fundamental to 110 Hz?',['f₁ = v/2L, so v = 2 × 0.65 × 110 = 143 m/s.','v = √(T/μ) gives T = μv² = 0.0012 × 143² = 24.5 N.'])}
${co('EE connection','Signals on cables are waves too. When a cable is longer than about λ/10 it behaves as a transmission line, and reflections appear unless its impedance is matched. Antennas are sized as fractions of λ: a 2.4 GHz Wi-Fi quarter-wave antenna is about 3.1 cm long.')}`,

thermo:()=>`<p class="lede">Thermodynamics deals with heat, temperature and the conversion of heat into work. For an EE student its most immediate use is keeping components cool: every watt a chip dissipates has to escape as heat.</p>
<h3>Temperature and heat</h3>
<p>Temperature measures the average kinetic energy of particles; heat is energy transferred because of a temperature difference. Use kelvin in gas laws and efficiencies: T(K) = T(°C) + 273.15. A <em>change</em> of 1 °C equals a change of 1 K.</p>
${sheet('Heat and materials',[['Specific heat','Q = mcΔT','c of water = 4186 J/kg·K'],['Latent heat','Q = mL','phase change at constant T'],['Linear expansion','ΔL = αLΔT','α ≈ 12×10⁻⁶ /K for steel'],['Conduction (Fourier)','P = kAΔT / L','k: W/m·K'],['Radiation (Stefan–Boltzmann)','P = εσAT⁴','σ = 5.67×10⁻⁸ W/m²·K⁴'],['Convection','P = hAΔT','h depends on airflow']])}
<h3>Heat transfer and thermal resistance</h3>
<p>Fourier's law has the same form as Ohm's law. Define thermal resistance R_θ = L/(kA) in °C/W; then ΔT = P·R_θ, just as V = IR. Thermal resistances in series add, and in parallel combine like resistors.</p>
${fig(figThermal(),'A power transistor\'s heat path: junction → case → heat sink → air.')}
${wx('A regulator dissipates 8 W. Rθjc = 1.5 °C/W, Rθcs = 0.5 °C/W, heat sink 4 °C/W, ambient 35 °C. Is the 125 °C junction limit safe?',['Total thermal resistance = 1.5 + 0.5 + 4 = 6 °C/W.','Temperature rise = 8 × 6 = 48 °C, so Tj = 35 + 48 = 83 °C.','Below 125 °C, so it is safe with 42 °C of margin.'])}
<h3>Ideal gases and kinetic theory</h3>
<p>For an ideal gas, <i class="v">PV = nRT</i> (R = 8.314 J/mol·K), or PV = NkT per molecule (k = 1.381 × 10⁻²³ J/K). Kinetic theory shows the average translational kinetic energy per molecule is (3/2)kT. So temperature really is a measure of molecular motion, and at 300 K air molecules move at about 500 m/s.</p>
<h3>The first law</h3>
<p>Energy is conserved: <i class="v">ΔU = Q − W</i>, where Q is heat added to the system and W is work done <em>by</em> the system (W = ∫P dV for a gas).</p>
${tbl('Gas processes',['Process','Constant','Key result'],[['Isothermal','T','ΔU = 0, so Q = W = nRT ln(V₂/V₁)'],['Isobaric','P','W = PΔV'],['Isochoric','V','W = 0, so Q = ΔU'],['Adiabatic','no heat flow','PV^γ = constant; W = −ΔU']])}
<h3>The second law and heat engines</h3>
<p>Heat flows spontaneously from hot to cold, and no engine can turn heat completely into work. An engine taking Q_h from a hot reservoir and rejecting Q_c to a cold one has efficiency η = W/Q_h = 1 − Q_c/Q_h. The best possible is the Carnot limit <i class="v">η = 1 − T_c/T_h</i> (kelvin). A refrigerator or heat pump runs the cycle backwards; its coefficient of performance can exceed 1 because it moves heat rather than making it.</p>
${dv('Entropy in one paragraph',`<p>Entropy S measures how spread out energy is. For a reversible transfer, dS = dQ/T. The second law says the total entropy of an isolated system never decreases. Carnot efficiency follows: a reversible engine leaves total entropy unchanged, so Q_h/T_h = Q_c/T_c and η = 1 − T_c/T_h.</p>`)}
<h3>Common mistakes</h3>
${ul(['Using °C in PV = nRT or in Carnot efficiency.','Confusing heat (energy transferred) with temperature (a state).','Forgetting the latent heat when a phase change happens.'])}
${co('EE connection','Resistors, MOSFETs, LEDs and processors all have maximum junction temperatures. Datasheets give thermal resistances so you can choose a heat sink with the series-resistance method above. Thermistors and RTDs turn temperature into resistance, and thermocouples turn it into a small voltage.')}`,

em:()=>`<p class="lede">Electric charge and the fields it creates are the foundation of everything in electrical engineering. This topic builds the field picture; Gauss's law then makes symmetric problems almost effortless.</p>
<h3>Electric charge</h3>
${ul(['Two kinds, positive and negative; like charges repel, unlike attract.','Charge is <strong>quantised</strong> in units of e = 1.602 × 10⁻¹⁹ C (protons +e, electrons −e).','Charge is <strong>conserved</strong>: it can move but is never created or destroyed in total.','<strong>Conductors</strong> (metals) have mobile electrons; <strong>insulators</strong> do not; <strong>semiconductors</strong> sit between and can be tuned by doping.'])}
<h3>Coulomb's law</h3>
<p>The force between point charges is <i class="v">F = k|q₁q₂| / r²</i>, along the line joining them, with k = 1/(4πε₀) = 8.99 × 10⁹ N·m²/C² and ε₀ = 8.854 × 10⁻¹² F/m. With several charges, find each force separately and add them as vectors (superposition).</p>
<h3>The electric field</h3>
<p>The field is force per unit positive test charge: <i class="v">E = F/q</i> (N/C, equivalently V/m). A charge q placed in a field feels F = qE: along E if positive, against it if negative. For a point charge, E = kq/r², pointing away from positive charges.</p>
${fig(figField(),'Field lines start on positive charges and end on negative ones. Their density shows the field strength.')}
${ul(['Field lines never cross.','They leave conductors at right angles.','Closer lines mean a stronger field.','The tangent to a line gives the direction of E.'])}
${tbl('Fields of common charge distributions',['Distribution','Field','Falls off as'],[['Point charge q','kq / r²','1/r²'],['Dipole (far, on axis)','2kp / r³ (p = qd)','1/r³'],['Infinite line, λ C/m','λ / (2πε₀r)','1/r'],['Infinite plane, σ C/m²','σ / 2ε₀','constant'],['Parallel plates (between)','σ / ε₀ = V/d','uniform'],['Charged sphere (outside)','kQ / r²','1/r²; zero inside a conductor']])}
<h3>Electric flux and Gauss's law</h3>
<p>Flux measures how much field passes through a surface: Φ = ∫E·dA. Gauss's law states that the total flux out of any closed surface equals the enclosed charge over ε₀: <i class="v">∮E·dA = Q_enc / ε₀</i>. It is always true, and when the charge has spherical, cylindrical or planar symmetry it lets you find E in one line.</p>
${fig(figGauss(),'Choose a surface on which E is constant and perpendicular, then the integral becomes E × area.')}
${dv('Using Gauss\'s law: three classic cases',`<p><strong>Sphere:</strong> a spherical surface of radius r gives E·4πr² = Q/ε₀, so E = Q/(4πε₀r²): a point charge from outside. <strong>Line:</strong> a cylinder of radius r and length L gives E·2πrL = λL/ε₀, so E = λ/(2πε₀r). <strong>Plane:</strong> a pillbox of face area A straddling the sheet gives E·2A = σA/ε₀, so E = σ/2ε₀, independent of distance.</p>`)}
<h3>Conductors in electrostatic equilibrium</h3>
${ul(['E = 0 everywhere inside the conducting material.','Any excess charge sits on the outer surface.','Just outside, E is perpendicular to the surface with magnitude σ/ε₀.','Charge crowds at sharp points, so the field there is strongest, which is why lightning rods are pointed.','A closed conducting shell shields its interior from outside fields: the Faraday cage behind shielded cables and RF enclosures.'])}
<h3>Charges moving in a uniform field</h3>
<p>A uniform field gives constant acceleration a = qE/m. Released from rest, a charge moves in a straight line; entering sideways, it follows a parabola, as in the deflection plates of a cathode-ray tube or an ink-jet printer.</p>
<h3>Dipoles</h3>
<p>A dipole is +q and −q separated by d, with dipole moment p = qd pointing from − to +. In a uniform field it feels no net force but a torque τ = p × E, which lines it up with the field. Water molecules and dielectric materials behave this way, which is why dielectrics increase capacitance.</p>
${wx('Charges +4 µC at x = 0 and −2 µC at x = 0.3 m. Find E at x = 0.1 m.',['From +4 µC (0.1 m away): E₁ = 8.99×10⁹ × 4×10⁻⁶ / 0.01 = 3.60 × 10⁶ N/C, pointing +x (away).','From −2 µC (0.2 m away): E₂ = 8.99×10⁹ × 2×10⁻⁶ / 0.04 = 4.50 × 10⁵ N/C, pointing +x (towards it).','Both point +x, so E = 4.05 × 10⁶ N/C in the +x direction.'])}
${co('EE connection','Electrostatic discharge (ESD) damage, capacitor design, insulation breakdown (about 3 MV/m in dry air), touchscreens and shielding all come down to charges and fields. Gauss\'s law gives the capacitance of coaxial cables in a few lines.')}`,

potential:()=>`<p class="lede">Electric potential, or voltage, is energy per unit charge. It is a scalar, so it is often far easier to work with than the field, and it is the quantity every circuit is designed around.</p>
<h3>Potential energy and potential</h3>
<p>The electric force is conservative, so a charge in a field has potential energy U. The potential is <i class="v">V = U/q</i>, in volts (1 V = 1 J/C). Only differences matter: moving charge q through a potential difference ΔV changes its energy by qΔV. Positive charges fall to lower potential, and electrons fall to higher potential.</p>
${sheet('Potential',[['Definition','ΔV = −∫E·dl','work per unit charge, against the field'],['Uniform field','V = Ed','between parallel plates'],['Point charge','V = kq / r','zero at infinity; adds as a scalar'],['Field from potential','E = −dV/dx','E points downhill in V'],['Two charges','U = kq₁q₂ / r','energy of the pair'],['Electron-volt','1 eV = 1.602 × 10⁻¹⁹ J','energy gained crossing 1 V']])}
${fig(figEquip(),'Equipotentials are surfaces of constant V. The field is everywhere perpendicular to them and points towards lower V.')}
<h3>Equipotential surfaces</h3>
<p>No work is done moving a charge along an equipotential. Field lines cross equipotentials at right angles, and where equipotentials crowd together the field is strong. The surface of a conductor in equilibrium is an equipotential, so a wire in a circuit diagram is, ideally, one potential.</p>
<h3>Capacitance</h3>
<p>A capacitor is two conductors separated by an insulator. Charge ±Q on them produces a potential difference V proportional to Q; the ratio is the capacitance <i class="v">C = Q/V</i> (farads). It depends only on geometry and the material between the plates.</p>
${sheet('Capacitors',[['Parallel plate','C = ε₀εᵣA / d','area A, gap d'],['Coaxial cylinder','C = 2πε₀εᵣL / ln(b/a)','cables'],['Isolated sphere','C = 4πε₀R','Earth ≈ 710 µF'],['Parallel','C = C₁ + C₂ + …','add'],['Series','1/C = 1/C₁ + 1/C₂ + …','like resistors in parallel'],['Stored energy','U = ½CV² = Q²/2C = ½QV',''],['Energy density','u = ½ε₀εᵣE²','J/m³: energy lives in the field']])}
${dv('Derivation: parallel-plate capacitance',`<p>Gauss's law gives E = σ/ε₀ = Q/(ε₀A) between the plates. The potential difference is V = Ed = Qd/(ε₀A). So C = Q/V = ε₀A/d. Filling the gap with a dielectric reduces the field by εᵣ for the same charge, so C rises by εᵣ.</p>`)}
${dv('Derivation: energy stored',`<p>Moving a small charge dq onto a capacitor already at voltage v = q/C takes work dW = v dq = (q/C) dq. Integrating from 0 to Q: W = Q²/2C = ½CV². Dividing by the volume Ad and using V = Ed gives the energy density u = ½ε₀E².</p>`)}
<h3>Dielectrics</h3>
<p>Insulators between the plates polarise: their molecular dipoles align and partly cancel the field. This raises C by the relative permittivity εᵣ (about 2–4 for plastics and up to thousands for ceramics such as barium titanate) and allows a higher working voltage. Every dielectric has a breakdown strength above which it conducts and the capacitor fails.</p>
${wx('A 100 nF capacitor is charged to 50 V, disconnected, then a dielectric with εᵣ = 4 is inserted. Find the new voltage and energy.',['Charge is trapped: Q = CV = 100 nF × 50 V = 5 µC.','New capacitance = 400 nF, so V = Q/C = 12.5 V.','Energy falls from ½ × 100 nF × 50² = 125 µJ to ½ × 400 nF × 12.5² = 31.3 µJ. The dielectric is pulled in, and the field does work on it.'])}
${co('EE connection','Coaxial cables have a capacitance of about 100 pF/m, which limits the speed of long lines. Multilayer ceramic capacitors stack hundreds of thin plates to raise A/d. Electron energies in semiconductors and photons are naturally measured in eV.')}`,

current:()=>`<p class="lede">This is the physics underneath Ohm's law: what current actually is inside a wire, where resistance comes from, and why it changes with temperature and material.</p>
<h3>Electric current</h3>
<p>Current is the rate at which charge passes a cross-section: <i class="v">I = dQ/dt</i>, in amperes (1 A = 1 C/s ≈ 6.24 × 10¹⁸ electrons per second). Conventional current points in the direction positive charge would move; in metals the electrons actually drift the opposite way.</p>
${fig(figDrift(),'Electrons drift slowly against the field while colliding constantly with the lattice.')}
<h3>Drift velocity</h3>
<p>In a wire with n free carriers per m³, each of charge q, drifting at v_d through area A: <i class="v">I = nqv_dA</i>. For copper (n ≈ 8.5 × 10²⁸ m⁻³) carrying 1 A in a 1 mm² wire, v_d ≈ 0.07 mm/s. A light still switches on instantly because the electric field travels through the circuit at close to the speed of light, pushing on every electron at once.</p>
<h3>Current density and the microscopic Ohm's law</h3>
<p>Current density J = I/A (A/m²). In an ohmic material <i class="v">J = σE</i>, where σ is the conductivity and ρ = 1/σ the resistivity. Integrating over a uniform wire of length L gives V = EL and I = JA, so V = I(ρL/A): the familiar R.</p>
${sheet('Resistance',[['Resistance of a conductor','R = ρL / A','ρ in Ω·m'],['Temperature dependence','R = R₀(1 + αΔT)','α ≈ +0.0039 /°C for copper'],['Ohm\'s law','V = IR','only for ohmic materials'],['Power','P = IV = I²R = V²/R','Joule heating'],['Terminal voltage','V = ε − Ir','r = internal resistance']])}
${tbl('Resistivities at 20 °C',['Material','ρ (Ω·m)','Notes'],[['Silver','1.59 × 10⁻⁸','best conductor'],['Copper','1.68 × 10⁻⁸','wiring and PCB traces'],['Gold','2.44 × 10⁻⁸','corrosion-free contacts'],['Aluminium','2.65 × 10⁻⁸','light; used in power lines'],['Nichrome','1.10 × 10⁻⁶','heating elements'],['Silicon (pure)','≈ 2.3 × 10³','changes enormously with doping'],['Glass','10¹⁰ – 10¹⁴','insulator']])}
<h3>Temperature effects</h3>
<p>In metals, hotter atoms vibrate more and scatter electrons more, so resistance rises with temperature (positive α). In semiconductors, heat frees more carriers, so resistance falls: NTC thermistors exploit this. Some materials become superconductors below a critical temperature, with exactly zero resistance; MRI magnets use them.</p>
<h3>Ohmic and non-ohmic devices</h3>
<p>A device is ohmic if its I–V graph is a straight line through the origin. Resistors are; diodes, LEDs, lamps (whose filament heats up) and transistors are not. For them, R = V/I still defines a resistance at a point, but it changes with operating conditions.</p>
<h3>EMF and internal resistance</h3>
<p>A battery's emf ε is the energy per unit charge it supplies. Its internal resistance r wastes some: the terminal voltage V = ε − Ir drops as you draw more current. Maximum power reaches the load when R = r, the same rule as maximum power transfer in circuits.</p>
${wx('A 30 m extension cable uses copper conductors of 1.5 mm² (two conductors, so 60 m of wire). How much voltage is lost at 10 A?',['R = ρL/A = 1.68×10⁻⁸ × 60 / 1.5×10⁻⁶ = 0.672 Ω.','Drop = IR = 10 × 0.672 = 6.7 V.','Power wasted = I²R = 67 W, which heats the cable. A coiled-up reel can overheat for this reason.'])}
<h3>Why power lines use high voltage</h3>
<p>For a delivered power P = VI, the line current is P/V and the loss is I²R = P²R/V². Raising the voltage tenfold cuts losses a hundredfold. Transformers (see Electromagnetic Induction) make this practical.</p>
${co('EE connection','PCB trace widths, wire gauges and fuse ratings come from R = ρL/A and I²R heating. Hall-effect current sensors measure the drift of carriers sideways in a magnetic field. RTD temperature sensors rely on platinum\'s predictable α.')}`,

magnetism:()=>`<p class="lede">Moving charges create magnetic fields and feel magnetic forces. Motors, loudspeakers, Hall sensors, hard drives and MRI scanners all run on the ideas in this topic.</p>
<h3>Force on a moving charge</h3>
<p><i class="v">F = qv × B</i>, magnitude qvB sin θ. The force is perpendicular to both v and B, so it changes the direction of motion but never the speed: a magnetic field does no work. B is measured in tesla (1 T = 1 N/(A·m)); Earth's field is about 50 µT, a fridge magnet about 5 mT, and an MRI magnet 1.5–3 T.</p>
${co('Right-hand rule','Point your fingers along v (or along the current I), curl them towards B, and your thumb gives the force on a positive charge. For an electron, reverse it.')}
<h3>Circular motion of charges</h3>
<p>A charge moving perpendicular to a uniform B travels in a circle: qvB = mv²/r, so <i class="v">r = mv/(qB)</i>. The period T = 2πm/(qB) does not depend on speed, which is the principle of the cyclotron. Mass spectrometers sort ions by r. Crossed fields with E = vB let only one speed pass straight through (a velocity selector).</p>
<h3>Force on a current-carrying wire</h3>
<p>A wire carries many moving charges: <i class="v">F = IL × B</i>, magnitude BIL sin θ. A rectangular coil of N turns and area A in a field feels a torque τ = NIAB sin θ = μB sin θ, where μ = NIA is the magnetic moment. A DC motor uses a commutator to reverse the current every half turn so this torque keeps the rotor spinning the same way.</p>
<h3>Hall effect</h3>
<p>In a current-carrying strip in a magnetic field, the carriers are pushed to one side until the resulting transverse field balances the magnetic force. This gives a voltage V_H = IB/(nqt). Its sign reveals whether carriers are positive or negative, and its size measures B. Hall sensors in phones, motors and current clamps work this way.</p>
<h3>Sources of magnetic field</h3>
${sheet('Magnetic fields from currents',[['Biot–Savart law','dB = (μ₀/4π) I dl × r̂ / r²','general'],['Long straight wire','B = μ₀I / 2πr','circles around the wire'],['Centre of a circular loop','B = μ₀I / 2R','N turns: multiply by N'],['Long solenoid (inside)','B = μ₀nI','n = turns per metre; uniform'],['Toroid','B = μ₀NI / 2πr','field confined inside'],['Ampère\'s law','∮B·dl = μ₀I_enc','use with symmetry'],['Parallel wires','F/L = μ₀I₁I₂ / 2πd','same direction attract']])}
${fig(figWireField(),'Grip the wire with your right thumb along the current; your fingers curl in the direction of B.')}
${fig(figSolenoid(),'A solenoid makes a nearly uniform internal field, like a bar magnet with N and S ends.')}
${dv('Derivation: field of a long wire from Ampère\'s law',`<p>By symmetry B has the same magnitude everywhere on a circle of radius r around the wire and points along the circle. So ∮B·dl = B(2πr) = μ₀I, giving B = μ₀I/2πr. For a solenoid, take a rectangular loop with one side (length l) inside: Bl = μ₀(nl)I, so B = μ₀nI.</p>`)}
<h3>Magnetic materials</h3>
<p>Ferromagnetic materials (iron, nickel, cobalt, ferrites) have domains that align with an applied field, multiplying B by the relative permeability μᵣ (hundreds to many thousands). This is why transformer and inductor cores use iron or ferrite. They show hysteresis: some magnetisation remains when the field is removed, which is good for permanent magnets and hard-disk storage, and causes energy loss in transformer cores.</p>
${wx('Two power cables 5 cm apart each carry 200 A in opposite directions. Find the force per metre.',['F/L = μ₀I₁I₂ / 2πd = 4π×10⁻⁷ × 200 × 200 / (2π × 0.05).','F/L = 0.16 N/m, repulsive (opposite currents repel).','During a short-circuit fault at 20 kA, the force rises 10 000×, to 1600 N/m, which is why busbars need strong supports.'])}
${co('EE connection','Every motor, generator, relay, speaker, inductor and transformer is built from the formulas on this page. Magnetic field from PCB traces is also why high-current loops are kept small to reduce interference.')}`,

induction:()=>`<p class="lede">A changing magnetic field creates an electric field. This single fact, Faraday's law, makes generators, transformers, inductors, wireless charging and the entire power grid possible.</p>
<h3>Magnetic flux</h3>
<p>Flux measures how much field passes through a surface: <i class="v">Φ_B = BA cos θ</i> (or ∫B·dA), in webers (1 Wb = 1 T·m²), where θ is between B and the surface normal.</p>
<h3>Faraday's law and Lenz's law</h3>
<p>The emf induced around a loop equals the rate of change of flux through it: <i class="v">ε = −N dΦ/dt</i>. The flux can change because B changes, the area changes, or the loop rotates. Lenz's law (the minus sign) says the induced current flows so as to <em>oppose</em> the change that caused it. That is energy conservation: if it aided the change, you would get energy for nothing.</p>
${fig(figRails(),'Pushing the rod sweeps out area, so the flux changes and an emf appears.')}
${dv('Derivation: motional emf ε = BLv',`<p>Charges in the moving rod feel F = qvB along the rod. That is equivalent to an electric field vB acting over length L, so ε = BLv. Equivalently, the area of the circuit grows at dA/dt = Lv, so dΦ/dt = BLv. The current I = BLv/R then feels a force BIL opposing the motion (Lenz), and the mechanical power you supply, (BIL)v, exactly equals the electrical power I²R.</p>`)}
<h3>Generators and back emf</h3>
<p>A coil of N turns and area A rotating at ω in field B has Φ = BA cos ωt, so ε = NBAω sin ωt: alternating current. A motor is a generator run backwards. As it speeds up it generates a back emf that opposes the supply, which is why motors draw a large current at start-up and less at full speed.</p>
<h3>Eddy currents</h3>
<p>Changing flux through a solid conductor drives swirling currents inside it. They heat it (induction cooktops and furnaces) and oppose motion (magnetic brakes on trains and roller coasters). In transformers they waste energy, so cores are made of thin insulated laminations or ferrite.</p>
<h3>Self-inductance</h3>
<p>A coil's own changing current changes its own flux, inducing an emf that opposes the change: <i class="v">ε = −L dI/dt</i>. L = NΦ/I is the inductance in henries. Inductors resist sudden changes in current, which is why switching off an inductive load produces a voltage spike.</p>
${sheet('Induction formulas',[['Flux','Φ = BA cos θ','Wb'],['Faraday','ε = −N dΦ/dt',''],['Motional emf','ε = BLv',''],['Generator','ε = NBAω sin ωt','peak NBAω'],['Self-inductance','ε = −L dI/dt',''],['Solenoid inductance','L = μ₀μᵣN²A / l','grows as N²'],['Stored energy','U = ½LI²','field energy density B²/2μ₀'],['Ideal transformer','Vₛ/Vₚ = Nₛ/Nₚ = Iₚ/Iₛ','power in = power out']])}
<h3>Mutual inductance and transformers</h3>
<p>Two coils sharing flux are coupled by mutual inductance M: a changing current in one induces an emf in the other. A transformer wraps both on an iron core so nearly all the flux links both coils. Each turn sees the same dΦ/dt, so voltage scales with turns. An ideal transformer conserves power, so stepping voltage up steps current down. Transformers only work with AC, because DC gives no changing flux.</p>
<h3>Maxwell's equations</h3>
${tbl('The four equations of electromagnetism (integral form)',['Law','Equation','Meaning'],[['Gauss (E)','∮E·dA = Q/ε₀','charges create electric fields'],['Gauss (B)','∮B·dA = 0','no magnetic monopoles; field lines close'],['Faraday','∮E·dl = −dΦ_B/dt','changing B creates E'],['Ampère–Maxwell','∮B·dl = μ₀I + μ₀ε₀ dΦ_E/dt','currents and changing E create B']])}
<p>Together they predict waves of E and B travelling at c = 1/√(μ₀ε₀) = 3.00 × 10⁸ m/s. Maxwell recognised this as the speed of light, so light is an electromagnetic wave.</p>
${wx('A phone charger transformer steps 230 V down to 5 V and delivers 2 A. Find the turns ratio and primary current (ideal).',['Nₚ/Nₛ = 230/5 = 46.','Power out = 5 × 2 = 10 W = power in.','Iₚ = 10/230 = 43 mA. In practice modern chargers switch at high frequency so the transformer can be tiny.'])}
${co('EE connection','Generators, transformers, inductors, wireless chargers, RFID tags, guitar pickups, induction motors and current transformers all run on Faraday\'s law. Flyback diodes across relay coils exist because of ε = −L dI/dt.')}`,

optics:()=>`<p class="lede">Light is an electromagnetic wave, and it also arrives in packets called photons. You need both pictures: the wave picture explains fibres, lenses and interference; the photon picture explains LEDs, solar cells and photodetectors.</p>
<h3>The electromagnetic spectrum</h3>
${tbl('From radio to gamma rays (all travel at c in vacuum)',['Band','Wavelength','Typical use'],[['Radio','&gt; 1 m','AM/FM, TV, RFID'],['Microwave','1 mm – 1 m','Wi-Fi, mobile phones, radar, ovens'],['Infrared','700 nm – 1 mm','remote controls, fibre optics (1310/1550 nm), thermal imaging'],['Visible','400 – 700 nm','vision, displays, LEDs'],['Ultraviolet','10 – 400 nm','sterilisation, photolithography for chips'],['X-ray','0.01 – 10 nm','medical imaging, crystallography'],['Gamma','&lt; 0.01 nm','nuclear processes, cancer treatment']])}
<p>All EM waves obey <i class="v">c = fλ</i>, with c = 1/√(μ₀ε₀) = 2.998 × 10⁸ m/s. The E and B fields are perpendicular to each other and to the direction of travel, with E = cB.</p>
<h3>Reflection and refraction</h3>
<p>At a boundary, the angle of reflection equals the angle of incidence. Light entering a medium slows to v = c/n (n is the refractive index) and bends according to Snell's law, <i class="v">n₁ sin θ₁ = n₂ sin θ₂</i>, with angles measured from the normal. Its frequency stays the same, so its wavelength shortens to λ/n.</p>
${fig(figRefraction(),'Entering a slower medium, light bends towards the normal.')}
<h3>Total internal reflection and optical fibre</h3>
<p>Going from high n to low n, the refracted ray bends away from the normal. Beyond the critical angle, sin θ_c = n₂/n₁, no light escapes and it all reflects. Optical fibre traps light in a glass core (n ≈ 1.48) surrounded by cladding of slightly lower index, carrying data over kilometres with very little loss. Its numerical aperture NA = √(n₁² − n₂²) sets how wide a cone of light it accepts.</p>
<h3>Lenses</h3>
<p>The thin-lens equation is <i class="v">1/f = 1/d_o + 1/d_i</i>, with magnification m = −d_i/d_o. A converging lens forms a real, inverted image when the object is beyond f (cameras, projectors) and a virtual, magnified image when it is inside f (a magnifying glass).</p>
<h3>Interference and diffraction</h3>
<p>In Young's double slit, bright fringes appear where d sin θ = mλ, spaced y = λL/d on a screen. A diffraction grating with many slits sharpens these into narrow lines, which is how spectrometers measure wavelengths. Diffraction also limits resolution: features smaller than about λ cannot be imaged, which is why chipmakers moved to 13.5 nm extreme-ultraviolet light.</p>
<h3>Photons</h3>
<p>Light energy comes in quanta of <i class="v">E = hf = hc/λ</i>, with h = 6.626 × 10⁻³⁴ J·s. A handy form is E(eV) ≈ 1240/λ(nm): red light (650 nm) carries 1.9 eV per photon, and UV (250 nm) carries 5 eV.</p>
<h3>The photoelectric effect</h3>
<p>Shining light on a metal ejects electrons only if each photon's energy exceeds the work function φ, no matter how bright the light. The fastest electrons have <i class="v">K_max = hf − φ</i>. Brighter light gives more electrons, not faster ones. This could only be explained by photons, and earned Einstein his Nobel Prize.</p>
<h3>Matter waves</h3>
<p>Particles also behave as waves, with de Broglie wavelength λ = h/p. Electron microscopes exploit the tiny wavelengths of fast electrons, and quantum tunnelling, the basis of flash memory, follows from electrons being waves.</p>
<h3>Energy levels, band gaps and LEDs</h3>
<p>Electrons in atoms occupy discrete energy levels, and a jump between levels emits or absorbs a photon of exactly that energy difference. In a solid the levels merge into bands. In a semiconductor, a filled valence band and an empty conduction band are separated by a band gap E_g. When an electron falls across the gap it can emit a photon with λ ≈ 1240/E_g nm.</p>
${fig(figBands(),'Band gap sets the colour: GaAs (1.42 eV) emits infrared, InGaN (2.7 eV) emits blue.')}
${wx('Will a silicon solar cell (E_g = 1.12 eV) absorb 1550 nm light?',['Photon energy = 1240/1550 = 0.80 eV.','0.80 eV &lt; 1.12 eV, so the photon cannot lift an electron across the gap.','No: silicon is transparent at 1550 nm. Telecom detectors use InGaAs, which has a smaller gap.'])}
${co('EE connection','LEDs, laser diodes, photodiodes, solar cells, image sensors and fibre-optic links are all applications of photons and band gaps. A photodiode\'s cut-off wavelength is 1240/E_g nm, which tells you which material to use for which light.')}`,
});

NOTES.pre_phys=()=>_prePhys()+`
<h3>Vector arithmetic</h3>
${sheet('Vectors',[['Addition','A + B = (Aₓ + Bₓ, A_y + B_y)','add components, then recombine'],['Dot product','A·B = |A||B| cos θ = AₓBₓ + A_yB_y + A_zB_z','scalar; used for work and flux'],['Cross product','|A × B| = |A||B| sin θ','vector, perpendicular to both (right-hand rule); torque, magnetic force'],['Unit vector','Â = A / |A|','direction only']])}
<h3>Dimensional analysis</h3>
<p>Both sides of every equation must have the same units. Check v² = u² + 2as: m²/s² on the left, m²/s² + (m/s²)(m) on the right. This catches missing factors of t or g before you calculate anything. Arguments of sin, cos, exp and log must be dimensionless.</p>
<h3>Significant figures and estimation</h3>
${ul(['Give answers to about as many significant figures as the least precise data (usually 2–3).','Keep extra digits during the calculation and round only at the end.','Estimate first: if a falling ball takes 300 s to drop 2 m, something has gone wrong.'])}
${tbl('Physical constants',['Constant','Symbol','Value'],[['Gravitational acceleration','g','9.81 m/s²'],['Gravitational constant','G','6.674 × 10⁻¹¹ N·m²/kg²'],['Speed of light','c','2.998 × 10⁸ m/s'],['Elementary charge','e','1.602 × 10⁻¹⁹ C'],['Electron mass','mₑ','9.109 × 10⁻³¹ kg'],['Proton mass','mₚ','1.673 × 10⁻²⁷ kg'],['Coulomb constant','k = 1/4πε₀','8.99 × 10⁹ N·m²/C²'],['Permittivity of free space','ε₀','8.854 × 10⁻¹² F/m'],['Permeability of free space','μ₀','4π × 10⁻⁷ T·m/A'],['Planck constant','h','6.626 × 10⁻³⁴ J·s'],['Boltzmann constant','k_B','1.381 × 10⁻²³ J/K'],['Gas constant','R','8.314 J/mol·K'],['Avogadro number','N_A','6.022 × 10²³ /mol'],['Stefan–Boltzmann','σ','5.67 × 10⁻⁸ W/m²·K⁴']])}`;

  s+=`<path class="c1" d="${fnPath(x=>x*x+1,-1.95,1.95,sx,sy,60)}"/><circle class="pt" cx="${sx(1)}" cy="${sy(2)}" r="5"/>`+T(sx(1.95),sy(-2.6),'F(x) = x² + C: every member has F′(x) = 2x','end','tick');
  return svg(460,250,s,'Family of antiderivatives differing by a constant')}
function figTrigDeriv(){const P2=2*Math.PI,A=axes({w:520,h:230,x0:0,x1:P2,y0:-1.3,y1:1.3,noBox:true,xt:[[Math.PI/2,'π/2'],[Math.PI,'π'],[1.5*Math.PI,'3π/2'],[P2,'2π']],yt:[[-1,'−1'],[1,'1']]}),{sx,sy}=A;

  s+=T(sx(Math.PI/2),sy(1)-10,'sin x is flat here, where cos x = 0','middle','val')+T(sx(5.2),sy(1.12),'dashed: cos x = (sin x)′','end','tick');
  return svg(520,230,s,'Sine and its derivative, cosine')}
